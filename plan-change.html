<style>
  /* サイト全体で表示されるスクロールバーの配色を統一（水色） */
  *::-webkit-scrollbar { width: 9px; height: 9px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: #cfe6f1; border-radius: 999px; }
  *::-webkit-scrollbar-thumb:hover { background: #9ed2ea; }
  html { scrollbar-width: thin; scrollbar-color: #cfe6f1 transparent; }

  @font-face { font-family: 'GenEi Kiwami Gothic'; src: url('fonts/GenEiKiwamiGo.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(circle, #c9e2ef 1px, transparent 1px) 0 0/26px 26px, linear-gradient(180deg, #eef8fd 0%, #f7fbff 100%); font-family: 'Kosugi Maru', system-ui, sans-serif; color: #3b454a; line-height: 1.85; letter-spacing: 0.2px; text-rendering: optimizeLegibility; min-height: 100vh; }
  a { color: #2f9bd6; text-decoration: none; }
  .page { width: 100%; max-width: 1100px; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 36px; flex-wrap: nowrap; gap: 10px; }
  .logo { font-size: 20px; font-weight: 800; color: #2f9bd6;  font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-weight: 400; flex-shrink: 0; white-space: nowrap;}
  .navlinks { display: flex; gap: 10px; font-size: 13px; font-weight: 700; flex-wrap: wrap; flex: 0 1 auto; min-width: 0; }
  .navlinks > a { padding: 8px 16px; }
  .nav-toggle-btn { display: none; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: #eaf6fb; cursor: pointer; flex-shrink: 0; }
  .nav-active { background: #ffffff; color: #2f9bd6; border-radius: 999px; box-shadow: 0 2px 6px rgba(47,155,214,0.15); }
  .nav-inactive { color: #5c6b73; }
  .navlinks > a[data-action="logout"] { display: none; }
  .user { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: #5c6b73; flex-shrink: 0; white-space: nowrap; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #d6f0fb; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #1f7fb3; }

  @media (max-width: 1000px) {
    .topbar { padding: 16px 18px; position: relative; justify-content: flex-start; }
    .topbar > div:first-child { order: 1; }
    .topbar > div:last-child { order: 2; }
    .topbar > div:last-child { display: flex; flex-shrink: 0; gap: 6px; order: 2; margin-left: auto; }
    .avatar { flex-shrink: 0; }
    .user-name-row { display: none; }
    .user > a[data-action="logout"] { display: none; }
    .nav-toggle-btn { display: flex; order: 3; }
    .navlinks { display: none; }
    .topbar.nav-open .navlinks {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: calc(100% + 6px);
      left: 18px;
      right: 18px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(47,155,214,0.22);
      padding: 8px;
      gap: 2px;
      z-index: 60;
    }
    .topbar.nav-open .navlinks > a {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 10px;
    }
    .topbar.nav-open .navlinks > a[data-action="logout"] { display: block; border-top: 1px solid #eef2f4; margin-top: 4px; padding-top: 14px; }
    .topbar.nav-open .nav-active { box-shadow: none; }
  }
</style>

<div class="page">

  <div class="topbar">
    <div class="logo"><a href="mypage.html" style="display:flex;align-items:center;gap:6px;color:#2f9bd6;"><img src="logo-icon.png" alt="" style="height:36px;width:auto;display:block;">Xovy Studio ✧</a></div>
    <div class="nav-toggle-btn" onclick="toggleMobileNav()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f9bd6" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
    <div class="navlinks">
      <a href="mypage.html" class="nav-inactive">マイページ</a>
      <a href="apply.html" class="nav-inactive">ポイントを使う</a>
      <a href="history.html" class="nav-inactive" style="display: flex; align-items: center; gap: 6px;">申請履歴<span style="display: inline-flex; align-items: center; justify-content: center; min-width: 15px; height: 15px; padding: 0 4px; background: #c0524f; color: #fff; font-size: 9px; font-weight: 800; border-radius: 999px;">2</span></a>
      <a href="settings.html" class="nav-active">設定</a>
      <a href="#" data-action="logout" class="nav-inactive">ログアウト</a>
    </div>
    <div class="user">
      <div class="avatar" data-user-initial>A</div>
      <div class="user-name-row"><span data-user-name>[会員名]</span> さん</div>
      <a href="#" data-action="logout" style="font-size: 11px; color: #5c6b73; font-weight: 700;">ログアウト</a>
    </div>
  </div>

  <div style="padding: 4px 36px 36px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1;">

    <div style="font-size: 12px;"><a href="settings.html">← 設定に戻る</a></div>
    <div style="font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-size: 20px; font-weight: 800; font-weight: 400;">プランの変更・退会</div>
    <div style="font-size: 12px; color: #5c6b73;" id="plan-summary">読み込み中…</div>

    <div id="plan-error" style="display:none; background:#fbecec; border:1px solid #f3d3d3; color:#c0524f; font-size:12px; padding:10px 16px; border-radius:12px;"></div>

    <div style="background: #ffffff; border-radius: 18px; padding: 24px 26px; box-shadow: 0 3px 10px rgba(47,155,214,0.08); display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 14px; font-weight: 800;">① プラン変更</div>
      <div id="plan-change-desc" style="font-size: 12px; color: #4b5a61;">読み込み中…</div>
      <div id="plan-change-note" style="display:none; background: #fdf3e8; border: 1px solid #f2e0c4; border-radius: 12px; padding: 12px 16px; font-size: 12px; color: #a8722a; display: flex; align-items: center; gap: 8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a8722a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span id="plan-change-note-text"></span>
      </div>
      <div id="plan-change-btn" style="align-self: flex-start; background: #e4e9eb; color: #a3adb2; font-weight: 700; font-size: 12px; padding: 10px 22px; border-radius: 999px; cursor: not-allowed;">
        プランを変更する
      </div>
    </div>

    <div style="background: #ffffff; border-radius: 18px; padding: 24px 26px; box-shadow: 0 3px 10px rgba(47,155,214,0.08); display: flex; flex-direction: column; gap: 12px;">
      <div style="font-size: 14px; font-weight: 800; color: #c0524f;" id="leave-heading">② 退会</div>
      <div style="font-size: 12px; color: #4b5a61;">退会の申告期限は当月末までです。退会すると保有ポイントはすべて失効し、現金化・返金・譲渡はできません。</div>
      <div id="leave-note" style="background: #fbecec; border: 1px solid #f3d3d3; border-radius: 12px; padding: 12px 16px; font-size: 12px; color: #b2413d;">読み込み中…</div>
      <div id="leave-btn" style="align-self: flex-start; background: #ffffff; border: 1px solid #e2a6a3; color: #c0524f; font-weight: 700; font-size: 12px; padding: 10px 22px; border-radius: 999px; cursor: pointer;">
        退会を申請する
      </div>
    </div>

  </div>
</div>
<script>
  function toggleMobileNav() {
    var topbar = document.querySelector('.topbar');
    if (topbar) topbar.classList.toggle('nav-open');
  }
  document.addEventListener('click', function (e) {
    var topbar = document.querySelector('.topbar');
    if (topbar && topbar.classList.contains('nav-open') && !topbar.contains(e.target)) {
      topbar.classList.remove('nav-open');
    }
  });
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="auth.js"></script>
<script>
  var PLAN_LABELS = { point: 'ポイントプラン（月額10,000円＋消費税10%）', monthly: '月1プラン（月額25,000円＋消費税10%）' };
  var currentMember = null;
  var monthlyPlanFull = false;

  // ============================================================
  // テスト開発中のみ: 「3ヶ月経過後」「月1プラン定員」のプラン変更制限チェックを無効化する一時フラグ。
  // 本番公開前に必ず false に戻すこと（member-data.mjsのTEST_MODE_SKIP_LIMITSと合わせて戻す）。
  // ============================================================
  var TEST_MODE_SKIP_LIMITS = true;

  function showPlanError(msg) {
    var box = document.getElementById('plan-error');
    box.textContent = msg;
    box.style.display = 'block';
  }

  function formatDate(d) {
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  }

  function nextMonthFirst(from) {
    return new Date(from.getFullYear(), from.getMonth() + 1, 1);
  }

  function renderPlanSection(member) {
    var isMonthly = member.plan === 'monthly';
    document.getElementById('plan-summary').textContent =
      '現在のプラン：' + (PLAN_LABELS[member.plan] || member.plan) + '／現在保有中のポイント：' + member.point_balance + 'pt';

    var descEl = document.getElementById('plan-change-desc');
    var noteEl = document.getElementById('plan-change-note');
    var noteTextEl = document.getElementById('plan-change-note-text');
    var btnEl = document.getElementById('plan-change-btn');

    if (member.leave_requested_at) {
      descEl.textContent = '退会予告中のため、プラン変更はできません。';
      noteEl.style.display = 'none';
      btnEl.style.background = '#e4e9eb';
      btnEl.style.color = '#a3adb2';
      btnEl.style.cursor = 'not-allowed';
      btnEl.onclick = null;
      return;
    }

    if (isMonthly) {
      descEl.textContent = '月1プラン → ポイントプランへの変更は、初回決済日から3ヶ月経過後に可能になります。プラン変更時は保有ポイントがすべて失効し、変更は翌月から適用されます。';
      var created = new Date(member.created_at);
      var eligibleDate = new Date(created.getFullYear(), created.getMonth() + 3, created.getDate());
      var now = new Date();
      if (!TEST_MODE_SKIP_LIMITS && now < eligibleDate) {
        var daysLeft = Math.ceil((eligibleDate - now) / (1000 * 60 * 60 * 24));
        noteEl.style.display = 'flex';
        noteTextEl.textContent = 'あと' + daysLeft + '日でプラン変更が可能になります（変更可能日：' + formatDate(eligibleDate) + '）';
        btnEl.style.background = '#e4e9eb';
        btnEl.style.color = '#a3adb2';
        btnEl.style.cursor = 'not-allowed';
        btnEl.onclick = null;
      } else {
        noteEl.style.display = 'none';
        btnEl.textContent = 'ポイントプランに変更する';
        btnEl.style.background = '#2f9bd6';
        btnEl.style.color = '#ffffff';
        btnEl.style.cursor = 'pointer';
        btnEl.onclick = function () { changePlan('point'); };
      }
    } else {
      descEl.textContent = 'ポイントプラン → 月1プランへの変更は、定員（2名）に空きがある場合のみ可能です。変更は翌月から適用され、保有ポイントはすべて失効します。';
      if (!TEST_MODE_SKIP_LIMITS && monthlyPlanFull) {
        noteEl.style.display = 'flex';
        noteTextEl.textContent = '現在、月1プランは定員に達しているため変更できません。';
        btnEl.style.background = '#e4e9eb';
        btnEl.style.color = '#a3adb2';
        btnEl.style.cursor = 'not-allowed';
        btnEl.onclick = null;
      } else {
        noteEl.style.display = 'none';
        btnEl.textContent = '月1プランに変更する';
        btnEl.style.background = '#2f9bd6';
        btnEl.style.color = '#ffffff';
        btnEl.style.cursor = 'pointer';
        btnEl.onclick = function () { changePlan('monthly'); };
      }
    }
  }

  function changePlan(newPlan) {
    if (!window.confirm('プランを変更します。保有ポイントはすべて失効します。よろしいですか？')) return;
    AuthHelpers.callFunction('member-data', { method: 'POST', body: { action: 'change-plan', plan: newPlan } })
      .then(function () { location.href = 'settings.html'; })
      .catch(function (err) { showPlanError('プラン変更に失敗しました：' + err.message); });
  }

  function renderLeaveSection(member) {
    var headingEl = document.getElementById('leave-heading');
    var noteEl = document.getElementById('leave-note');
    var btnEl = document.getElementById('leave-btn');

    if (member.leave_requested_at) {
      var requestedAt = new Date(member.leave_requested_at);
      var effectiveDate = nextMonthFirst(requestedAt);
      headingEl.textContent = '② 退会（申告済み）';
      noteEl.textContent = formatDate(requestedAt) + ' に退会を申告済みです。' + formatDate(effectiveDate) + ' から退会となります。';
      btnEl.textContent = '退会の申告を取り消す';
      btnEl.style.background = '#ffffff';
      btnEl.style.borderColor = '#dcedf5';
      btnEl.style.color = '#5c6b73';
      btnEl.onclick = function () {
        if (!window.confirm('退会の申告を取り消しますか？')) return;
        AuthHelpers.callFunction('member-data', { method: 'POST', body: { action: 'cancel-leave-request' } })
          .then(loadData)
          .catch(function (err) { showPlanError('取り消しに失敗しました：' + err.message); });
      };
    } else {
      var now = new Date();
      var effectiveDate = nextMonthFirst(now);
      headingEl.textContent = '② 退会';
      noteEl.textContent = '今月中（〜' + formatDate(new Date(now.getFullYear(), now.getMonth() + 1, 0)) + '）に申告いただくと、' + formatDate(effectiveDate) + ' から退会となります';
      btnEl.textContent = '退会を申請する';
      btnEl.style.background = '#ffffff';
      btnEl.style.borderColor = '#e2a6a3';
      btnEl.style.color = '#c0524f';
      btnEl.onclick = function () {
        if (!window.confirm('退会を申告します。' + formatDate(effectiveDate) + ' から退会となり、保有ポイントは失効します。よろしいですか？')) return;
        AuthHelpers.callFunction('member-data', { method: 'POST', body: { action: 'request-leave' } })
          .then(loadData)
          .catch(function (err) { showPlanError('退会の申告に失敗しました：' + err.message); });
      };
    }
  }

  function loadData() {
    AuthHelpers.callFunction('member-data', { method: 'GET' }).then(function (data) {
      currentMember = data.member;
      monthlyPlanFull = !!data.monthlyPlanFull;
      document.getElementById('plan-error').style.display = 'none';
      renderPlanSection(data.member);
      renderLeaveSection(data.member);
    }).catch(function (err) {
      showPlanError('読み込みに失敗しました：' + err.message);
    });
  }

  if (window.netlifyIdentity) {
    netlifyIdentity.on('init', function (user) { if (user) loadData(); });
  }
</script>
