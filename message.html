<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メッセージ｜[サイト名]</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(circle, #e3f0f7 1px, transparent 1px) 0 0/26px 26px, linear-gradient(180deg, #eef8fd 0%, #f7fbff 100%); font-family: 'M PLUS Rounded 1c', system-ui, sans-serif; color: #3b454a; min-height: 100vh; }
  a { color: #2f9bd6; text-decoration: none; }
  a:hover { color: #1f7fb3; }
  .page { width: 100%; max-width: 900px; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 36px; flex-wrap: wrap; gap: 10px; }
  .logo { font-size: 20px; font-weight: 800; color: #2f9bd6; }
  .navlinks { display: flex; gap: 10px; font-size: 13px; font-weight: 700; flex-wrap: wrap; }
  .navlinks > a { padding: 8px 16px; }
  .nav-active { background: #ffffff; color: #2f9bd6; border-radius: 999px; box-shadow: 0 2px 6px rgba(47,155,214,0.15); }
  .nav-inactive { color: #8fa2ac; }
  .user { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: #5c6b73; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #d6f0fb; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #1f7fb3; }

  .quote-card { background: #f9f7fd; border: 1.5px solid #e3dcf5; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; max-width: 420px; align-self: flex-start; }
  .delivery-card { background: #f3faf5; border: 1.5px solid #cfe8d6; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; max-width: 420px; align-self: flex-start; }
  .balance-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 700; padding: 8px 12px; border-radius: 8px; background: #e6f7ea; border: 1px solid #cdebd4; color: #3f9457; }
  .accept-btn { background: #2f9bd6; color: #fff; font-weight: 700; font-size: 12.5px; padding: 10px 0; border-radius: 999px; text-align: center; cursor: pointer; box-shadow: 0 4px 12px rgba(47,155,214,0.3); }
  .accept-btn:hover { opacity: 0.92; }
  .msg-row { display: flex; flex-direction: column; gap: 4px; }
  .bubble { font-size: 13px; padding: 12px 16px; max-width: 420px; line-height: 1.6; }
  .bubble.mine { background: #2f9bd6; color: #fff; border-radius: 16px 4px 16px 16px; align-self: flex-end; }
  .bubble.theirs { background: #f2f6f7; color: #3b454a; border-radius: 4px 16px 16px 16px; align-self: flex-start; }
  .meta { font-size: 10px; color: #b3c2c9; }
  .send-box { display: flex; align-items: center; gap: 10px; border-top: 1px solid #eef2f4; padding-top: 16px; }
  .send-input { flex-grow: 1; border: 1px solid #dcedf5; border-radius: 999px; padding: 10px 18px; font-size: 13px; color: #3b454a; font-family: inherit; outline: none; }
  .send-btn { background: #2f9bd6; color: #fff; font-weight: 700; font-size: 13px; padding: 10px 22px; border-radius: 999px; cursor: pointer; flex-shrink: 0; }
  .send-btn:hover { opacity: 0.92; }
  .send-btn.disabled { background: #cbd8dd; cursor: not-allowed; }
</style>
</head>
<body data-require-auth>
<div class="page">

  <div class="topbar">
    <div class="logo"><a href="mypage.html" style="color:#2f9bd6;">[サイト名] ✧</a></div>
    <div class="navlinks">
      <a href="mypage.html" class="nav-inactive">マイページ</a>
      <a href="apply.html" class="nav-inactive">ポイントを使う</a>
      <a href="history.html" class="nav-active" style="display: flex; align-items: center; gap: 6px;">申請履歴<span id="nav-badge-history" style="display: none; align-items: center; justify-content: center; min-width: 15px; height: 15px; padding: 0 4px; background: #c0524f; color: #fff; font-size: 9px; font-weight: 800; border-radius: 999px;">0</span></a>
      <a href="settings.html" class="nav-inactive">設定</a>
    </div>
    <div class="user">
      <div class="avatar" data-user-initial>A</div>
      <div><span data-user-name>[会員名]</span> さん</div>
      <a href="#" data-action="logout" style="font-size: 11px; color: #9db0b8; font-weight: 700;">ログアウト</a>
    </div>
  </div>

  <div style="padding: 4px 36px 30px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1;">

    <div style="font-size: 12px;"><a href="history.html">← 申請履歴に戻る</a></div>

    <div id="thread-error" style="display:none; background:#fbecec; border:1px solid #f3d3d3; color:#c0524f; font-size:12px; padding:10px 16px; border-radius:12px;"></div>

    <div id="thread-wrap" style="display:none; flex-direction: column; gap: 14px; flex-grow: 1;">

      <div style="background: #ffffff; border-radius: 18px; padding: 18px 24px; box-shadow: 0 3px 10px rgba(47,155,214,0.08); display: flex; align-items: center; justify-content: space-between; gap: 10px;">
        <div style="min-width: 0;">
          <div style="font-size: 11px; color: #9db0b8;">保有ポイント：<span id="balance-text" style="font-weight: 800; color: #2f9bd6;">ー</span></div>
          <div id="thread-title" style="font-size: 15px; font-weight: 800; margin-top: 3px;">読み込み中…</div>
          <div id="thread-started" style="font-size: 11px; color: #9db0b8; margin-top: 3px;"></div>
        </div>
        <div id="status-pill" style="font-size: 11px; font-weight: 700; padding: 5px 14px; border-radius: 999px; background: #eef2f4; color: #8fa2ac; flex-shrink: 0;">ー</div>
      </div>

      <div style="background: #ffffff; border-radius: 18px; padding: 22px 24px; box-shadow: 0 3px 10px rgba(47,155,214,0.08); display: flex; flex-direction: column; gap: 16px; flex-grow: 1;">

        <div style="font-size: 13px; font-weight: 800;">やり取り</div>

        <div id="messages" style="display: flex; flex-direction: column; gap: 14px; flex-grow: 1;">
          <div style="padding: 20px 0; font-size: 12px; color: #9db0b8; text-align: center;">読み込み中…</div>
        </div>

        <div class="send-box">
          <input id="send-input" class="send-input" type="text" placeholder="メッセージを入力…" maxlength="2000">
          <div id="send-btn" class="send-btn" onclick="sendMessage()">送信</div>
        </div>

        <div style="font-size: 10.5px; color: #b3c2c9; text-align: center;">新着メッセージは登録メールアドレスにも通知されます。メールが届かない場合は、迷惑メールフォルダをご確認ください。</div>

      </div>

    </div>

  </div>
</div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="auth.js"></script>
<script>
  var STATUS_STYLE = {
    'ヒアリング中': { bg: '#f1eefb', color: '#6a4fc0' },
    '制作中': { bg: '#fff0da', color: '#b3791a' },
    '対応完了': { bg: '#e6f7ea', color: '#3f9457' },
    'キャンセル': { bg: '#eef2f4', color: '#8fa2ac' }
  };

  var applicationId = new URLSearchParams(location.search).get('id');
  var currentApplication = null;

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formatDateTime(iso) {
    var d = new Date(iso);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function formatDate(iso) {
    var d = new Date(iso);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  function showError(msg) {
    document.getElementById('thread-error').textContent = msg;
    document.getElementById('thread-error').style.display = 'block';
    document.getElementById('thread-wrap').style.display = 'none';
  }

  function renderMessages(messages, application) {
    var container = document.getElementById('messages');
    if (!messages.length) {
      container.innerHTML = '<div style="padding: 20px 0; font-size: 12px; color: #9db0b8; text-align: center;">まだメッセージはありません</div>';
      return;
    }
    container.innerHTML = messages.map(function (m) {
      var when = formatDateTime(m.created_at);

      if (m.kind === 'system') {
        return (
          '<div style="display:flex; justify-content:center;">' +
            '<div style="background:#f2f6f7; color:#8fa2ac; font-size:11.5px; padding:10px 18px; border-radius:999px; text-align:center; max-width:480px; line-height:1.6;">' + escapeHtml(m.body) + '</div>' +
          '</div>'
        );
      }

      if (m.kind === 'quote') {
        var priceYen = (m.point_cost * 10000).toLocaleString();
        var actions = '';
        if (m.quote_status === 'pending' && application.status === 'ヒアリング中') {
          actions =
            '<div style="display:flex; flex-direction:column; gap:6px;">' +
              '<div class="accept-btn" onclick="acceptQuote()">この内容で正式受付する</div>' +
            '</div>';
        } else if (m.quote_status === 'accepted') {
          actions = '<div style="font-size:12px; font-weight:800; color:#3f9457; display:flex; align-items:center; gap:6px;">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3f9457" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' +
            '正式受付済み</div>';
        } else if (m.quote_status === 'superseded') {
          actions = '<div style="font-size:11px; color:#b3c2c9;">このご提案は新しい内容に更新されました</div>';
        }
        return (
          '<div class="msg-row" style="align-items:flex-start;">' +
            '<div class="quote-card">' +
              '<div style="display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800; color:#6a4fc0;">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6a4fc0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>' +
                '運営からのポイントご提示' +
              '</div>' +
              '<div style="font-size:20px; font-weight:800; color:#3b454a;">' + m.point_cost + 'pt<span style="font-size:12px; font-weight:700; color:#9db0b8; margin-left:6px;">（¥' + priceYen + '＋消費税10%）</span></div>' +
              (m.body ? '<div style="font-size:12px; color:#4b5a61; line-height:1.6;">' + escapeHtml(m.body) + '</div>' : '') +
              actions +
            '</div>' +
            '<div class="meta">運営　' + when + '</div>' +
          '</div>'
        );
      }

      if (m.kind === 'delivery') {
        return (
          '<div class="msg-row" style="align-items:flex-start;">' +
            '<div class="delivery-card">' +
              '<div style="display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800; color:#3f9457;">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3f9457" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V7a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 7v10a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 17v-1"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg>' +
                '納品のお知らせ' +
              '</div>' +
              '<div style="font-size:12px; color:#4b5a61; line-height:1.6;">' + escapeHtml(m.body) + '</div>' +
            '</div>' +
            '<div class="meta">運営　' + when + '</div>' +
          '</div>'
        );
      }

      // 通常のテキストメッセージ
      var mine = (m.sender === 'member');
      return (
        '<div class="msg-row" style="align-items:' + (mine ? 'flex-end' : 'flex-start') + ';">' +
          '<div class="bubble ' + (mine ? 'mine' : 'theirs') + '">' + escapeHtml(m.body) + '</div>' +
          '<div class="meta">' + (mine ? 'あなた' : '運営') + '　' + when + '</div>' +
        '</div>'
      );
    }).join('');

    container.scrollTop = container.scrollHeight;
  }

  function renderThread(data) {
    currentApplication = data.application;
    document.getElementById('thread-error').style.display = 'none';
    document.getElementById('thread-wrap').style.display = 'flex';

    document.getElementById('balance-text').textContent = data.member.point_balance + 'pt';
    document.getElementById('thread-title').textContent = data.application.title;
    document.getElementById('thread-started').textContent = '相談開始：' + formatDate(data.application.created_at);

    var style = STATUS_STYLE[data.application.status] || { bg: '#eef2f4', color: '#8fa2ac' };
    var pill = document.getElementById('status-pill');
    pill.textContent = data.application.status;
    pill.style.background = style.bg;
    pill.style.color = style.color;

    renderMessages(data.messages, data.application);
  }

  function loadThread() {
    AuthHelpers.callFunction('member-data', { method: 'GET', query: { thread: applicationId } }).then(renderThread).catch(function (err) {
      showError('読み込みに失敗しました：' + err.message);
    });
  }

  function sendMessage() {
    var input = document.getElementById('send-input');
    var text = input.value.trim();
    if (!text) return;
    var btn = document.getElementById('send-btn');
    btn.classList.add('disabled');
    AuthHelpers.callFunction('member-data', { method: 'POST', body: { action: 'send-message', application_id: Number(applicationId), body: text } })
      .then(function () {
        input.value = '';
        btn.classList.remove('disabled');
        loadThread();
      })
      .catch(function (err) {
        btn.classList.remove('disabled');
        alert('送信に失敗しました：' + err.message);
      });
  }

  function acceptQuote() {
    AuthHelpers.callFunction('member-data', { method: 'POST', body: { action: 'accept-quote', application_id: Number(applicationId) } })
      .then(loadThread)
      .catch(function (err) {
        alert('正式受付に失敗しました：' + err.message);
      });
  }

  document.getElementById('send-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') sendMessage();
  });

  function updateNavBadge() {
    AuthHelpers.callFunction('member-data', { method: 'GET' }).then(function (data) {
      var total = (data.applications || []).reduce(function (sum, a) { return sum + (a.unread_count || 0); }, 0);
      var badge = document.getElementById('nav-badge-history');
      if (total > 0) {
        badge.textContent = total;
        badge.style.display = 'inline-flex';
      } else {
        badge.style.display = 'none';
      }
    }).catch(function () {});
  }

  if (window.netlifyIdentity) {
    netlifyIdentity.on('init', function (user) {
      if (!user || !window.AuthHelpers) return;
      if (!applicationId) {
        showError('表示する申請が指定されていません。申請履歴から選び直してください。');
        return;
      }
      loadThread();
      updateNavBadge();
    });
  }
</script>
<div style="text-align: center; padding: 18px 36px 14px; font-size: 10.5px; color: #b3c2c9;">

</div>
</body>
</html>
