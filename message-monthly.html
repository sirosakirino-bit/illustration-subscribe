<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メッセージ（今月のご依頼）｜Xovy Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Dela+Gothic+One&display=swap">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="favicon-180.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<style>
  /* サイト全体で表示されるスクロールバーの配色を統一（水色） */
  *::-webkit-scrollbar { width: 9px; height: 9px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: #cfe6f1; border-radius: 999px; }
  *::-webkit-scrollbar-thumb:hover { background: #9ed2ea; }
  html { scrollbar-width: thin; scrollbar-color: #cfe6f1 transparent; }

  @font-face { font-family: 'GenEi Kiwami Gothic'; src: url('fonts/GenEiKiwamiGo.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(circle, #c9e2ef 1px, transparent 1px) 0 0/26px 26px, linear-gradient(180deg, #eef8fd 0%, #f7fbff 100%); font-family: 'Kosugi Maru', system-ui, sans-serif; color: #3b454a; line-height: 1.85; letter-spacing: 0.2px; text-rendering: optimizeLegibility; min-height: 100vh; }
  a { color: #2f9bd6; text-decoration: none; }
  a:hover { color: #1f7fb3; }
  .page { width: 100%; max-width: 900px; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 36px; flex-wrap: nowrap; gap: 10px; width: 100vw; position: relative; left: 50%; margin-left: -50vw; box-sizing: border-box; }
  .logo { font-size: 20px; font-weight: 800; color: #2f9bd6;  font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-weight: 400; flex-shrink: 0; white-space: nowrap;}
  .navlinks { display: flex; gap: 10px; font-size: 13px; font-weight: 700; flex-wrap: wrap; flex: 0 1 auto; min-width: 0; }
  .navlinks > a { padding: 8px 16px; }
  .nav-toggle-btn { display: none; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: #eaf6fb; cursor: pointer; flex-shrink: 0; }
  .nav-active { background: #ffffff; color: #2f9bd6; border-radius: 999px; box-shadow: 0 2px 6px rgba(47,155,214,0.15); }
  .nav-inactive { color: #5c6b73; }
  .user { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: #5c6b73; flex-shrink: 0; white-space: nowrap; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #d6f0fb; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #1f7fb3; }

  .quote-card { background: #f9f7fd; border: 1.5px solid #e3dcf5; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; max-width: 440px; align-self: flex-start; }
  .delivery-card { background: #f3faf5; border: 1.5px solid #cfe8d6; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; max-width: 420px; align-self: flex-start; }
  .accept-btn { background: #2f9bd6; color: #fff; font-weight: 700; font-size: 12.5px; padding: 10px 0; border-radius: 999px; text-align: center; cursor: pointer; box-shadow: 0 4px 12px rgba(47,155,214,0.3); }
  .accept-btn:hover { opacity: 0.92; }
  .msg-row { display: flex; flex-direction: column; gap: 4px; }
  .bubble { font-size: 13px; padding: 12px 16px; max-width: 420px; line-height: 1.6; white-space: pre-wrap; }
  .bubble.mine { background: #2f9bd6; color: #fff; border-radius: 16px 4px 16px 16px; align-self: flex-end; }
  .bubble.theirs { background: #f2f6f7; color: #3b454a; border-radius: 4px 16px 16px 16px; align-self: flex-start; }
  .meta { font-size: 10px; color: #b3c2c9; }
  .send-box { display: flex; align-items: flex-end; gap: 10px; border-top: 1px solid #eef2f4; padding-top: 16px; }
  .send-input { flex-grow: 1; border: 1px solid #dcedf5; border-radius: 18px; padding: 10px 18px; font-size: 13px; color: #3b454a; font-family: inherit; outline: none; resize: none; max-height: 160px; line-height: 1.5; }
  .send-btn { background: #2f9bd6; color: #fff; font-weight: 700; font-size: 13px; padding: 10px 22px; border-radius: 999px; cursor: pointer; flex-shrink: 0; }
  .send-btn:hover { opacity: 0.92; }
  .send-btn.disabled { background: #cbd8dd; cursor: not-allowed; }
  .kbd { background: #eef2f4; border: 1px solid #dcedf5; border-radius: 5px; padding: 1px 6px; font-family: ui-monospace, monospace; color: #5c6b73; }

  @media (max-width: 820px) {
    .topbar { padding: 16px 18px; position: relative; }
    .topbar > div:first-child { order: 1; }
    .topbar > div:last-child { order: 2; }
    .topbar > div:last-child { display: none; }
    .user-name-row { display: none; }
    .nav-toggle-btn { display: flex; order: 3; }
    .navlinks { display: none; }
    .topbar.nav-open .navlinks {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: calc(100% + 6px);
      left: 18px;
      right: 18px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(47,155,214,0.22);
      padding: 8px;
      gap: 2px;
      z-index: 60;
    }
    .topbar.nav-open .navlinks > a {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 10px;
    }
    .topbar.nav-open .nav-active { box-shadow: none; }
  }
</style>
</head>
<body data-require-auth>
<div class="page">

  <div class="topbar">
    <div class="logo"><a href="mypage.html" style="display:flex;align-items:center;gap:6px;color:#2f9bd6;"><img src="logo-icon.png" alt="" style="height:36px;width:auto;display:block;">Xovy Studio ✧</a></div>
    <div class="nav-toggle-btn" onclick="toggleMobileNav()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f9bd6" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
    <div class="navlinks">
      <a href="mypage.html" class="nav-inactive">マイページ</a>
      <a href="history.html" class="nav-active" style="display: flex; align-items: center; gap: 6px;">申請履歴<span id="nav-badge-history" style="display: none; align-items: center; justify-content: center; min-width: 15px; height: 15px; padding: 0 4px; background: #c0524f; color: #fff; font-size: 9px; font-weight: 800; border-radius: 999px;">0</span></a>
      <a href="settings.html" class="nav-inactive">設定</a>
    </div>
    <div class="user">
      <div class="avatar" data-user-initial>B</div>
      <div class="user-name-row"><span data-user-name>[会員名B]</span> さん</div>
      <a href="#" data-action="logout" style="font-size: 11px; color: #5c6b73; font-weight: 700;">ログアウト</a>
    </div>
  </div>

  <div style="padding: 4px 36px 30px; display: flex; flex-direction: column; gap: 14px; flex-grow: 1;">

    <div style="font-size: 12px;"><a href="apply-monthly.html">← 今月のご依頼に戻る</a></div>

    <div style="background: #fff8ec; border: 1px solid #f5e3bd; border-radius: 12px; padding: 10px 16px; font-size: 11.5px; color: #9c7a2e; line-height: 1.7;">営業時間は平日9:00〜17:00です。営業時間外や休業日にいただいたメッセージは、翌営業日以降のご返信となります。あらかじめご了承ください。</div>

    <div id="thread-error" style="display:none; background:#fbecec; border:1px solid #f3d3d3; color:#c0524f; font-size:12px; padding:10px 16px; border-radius:12px;"></div>

    <div id="thread-wrap" style="display:none; flex-direction: column; gap: 14px; flex-grow: 1;">

      <div style="background: #ffffff; border-radius: 18px; padding: 18px 24px; box-shadow: 0 3px 10px rgba(47,155,214,0.08); display: flex; align-items: center; justify-content: space-between; gap: 10px;">
        <div style="min-width: 0;">
          <div style="font-size: 11px; color: #5c6b73;">今月の確保枠：<span style="font-weight: 800; color: #2f9bd6;">2pt相当</span></div>
          <div id="thread-title" style="font-size: 15px; font-weight: 800; margin-top: 3px;">読み込み中…</div>
          <div id="thread-started" style="font-size: 11px; color: #5c6b73; margin-top: 3px;"></div>
        </div>
        <div id="status-pill" style="font-size: 11px; font-weight: 700; padding: 5px 14px; border-radius: 999px; background: #eef2f4; color: #5c6b73; flex-shrink: 0;">ー</div>
      </div>

      <div style="background: #ffffff; border-radius: 18px; padding: 22px 24px; box-shadow: 0 3px 10px rgba(47,155,214,0.08); display: flex; flex-direction: column; gap: 16px; flex-grow: 1;">

        <div style="font-size: 13px; font-weight: 800;">やり取り</div>

        <div id="messages" style="display: flex; flex-direction: column; gap: 14px; flex-grow: 1;">
          <div style="padding: 20px 0; font-size: 12px; color: #5c6b73; text-align: center;">読み込み中…</div>
        </div>

        <div class="send-box">
          <textarea id="send-input" class="send-input" rows="1" placeholder="メッセージを入力…" maxlength="2000"></textarea>
          <div id="send-btn" class="send-btn" onclick="sendMessage()">送信</div>
        </div>

        <div id="send-hint" style="font-size: 10.5px; color: #b3c2c9; text-align: right;"></div>

        <div style="font-size: 10.5px; color: #b3c2c9; text-align: center;">お知らせメールが届かない場合は、迷惑メールフォルダに振り分けられていないかご確認ください。</div>

      </div>

    </div>

  </div>
</div>

<script>
  function toggleMobileNav() {
    var topbar = document.querySelector('.topbar');
    if (topbar) topbar.classList.toggle('nav-open');
  }
  document.addEventListener('click', function (e) {
    var topbar = document.querySelector('.topbar');
    if (topbar && topbar.classList.contains('nav-open') && !topbar.contains(e.target)) {
      topbar.classList.remove('nav-open');
    }
  });
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="auth.js"></script>
<script>
  var STATUS_STYLE = {
    'ヒアリング中': { bg: '#f1eefb', color: '#6a4fc0' },
    '制作中': { bg: '#fff0da', color: '#b3791a' },
    '対応完了': { bg: '#e6f7ea', color: '#3f9457' },
    'キャンセル': { bg: '#eef2f4', color: '#8fa2ac' }
  };

  var applicationId = new URLSearchParams(location.search).get('id');
  var currentApplication = null;

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formatDateTime(iso) {
    var d = new Date(iso);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }
  function formatDate(iso) {
    var d = new Date(iso);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  function showError(msg) {
    document.getElementById('thread-error').textContent = msg;
    document.getElementById('thread-error').style.display = 'block';
    document.getElementById('thread-wrap').style.display = 'none';
  }

  function renderMessages(messages, application) {
    var container = document.getElementById('messages');
    if (!messages.length) {
      container.innerHTML = '<div style="padding: 20px 0; font-size: 12px; color: #5c6b73; text-align: center;">まだメッセージはありません</div>';
      return;
    }
    container.innerHTML = messages.map(function (m) {
      var when = formatDateTime(m.created_at);

      if (m.kind === 'system') {
        return (
          '<div style="display:flex; justify-content:center;">' +
            '<div style="background:#f2f6f7; color:#5c6b73; font-size:11.5px; padding:10px 18px; border-radius:999px; text-align:center; max-width:480px; line-height:1.6;">' + escapeHtml(m.body) + '</div>' +
          '</div>'
        );
      }

      if (m.kind === 'quote') {
        var hasExtra = m.point_cost >= 3;
        var actions = '';
        if (m.quote_status === 'pending' && application.status === 'ヒアリング中') {
          actions =
            '<div style="display:flex; flex-direction:column; gap:6px;">' +
              '<div class="accept-btn" onclick="acceptQuote()">この内容で正式受付する' + (hasExtra ? '（追加購入に同意する）' : '') + '</div>' +
            '</div>';
        } else if (m.quote_status === 'accepted') {
          actions = '<div style="font-size:12px; font-weight:800; color:#3f9457; display:flex; align-items:center; gap:6px;">' +
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3f9457" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' +
            '正式受付済み</div>';
        } else if (m.quote_status === 'superseded') {
          actions = '<div style="font-size:11px; color:#b3c2c9;">このご提案は新しい内容に更新されました</div>';
        }
        return (
          '<div class="msg-row" style="align-items:flex-start;">' +
            '<div class="quote-card">' +
              '<div style="display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800; color:#6a4fc0;">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6a4fc0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>' +
                '今月のご依頼内容のご提示' +
              '</div>' +
              '<div style="font-family: \'GenEi Kiwami Gothic\', \'Dela Gothic One\', system-ui, sans-serif; font-size:16px; font-weight:800; font-weight: 400; color:#3b454a;">' +
                (hasExtra ? '確保枠2pt ＋ 追加購入1pt<span style="font-size:12px; font-weight:700; color:#5c6b73; margin-left:6px;">（計3pt相当）</span>' : '確保枠2pt相当<span style="font-size:12px; font-weight:700; color:#5c6b73; margin-left:6px;">（追加購入なし）</span>') +
              '</div>' +
              (hasExtra ? '<div style="font-size:12px; font-weight:700; color:#a8722a; background:#fdf3e8; padding:6px 12px; border-radius:8px;">追加購入：+1pt（+10,000円＋消費税10%）</div>' : '') +
              (m.body ? '<div style="font-size:12px; color:#4b5a61; line-height:1.6;">' + escapeHtml(m.body) + '</div>' : '') +
              actions +
            '</div>' +
            '<div class="meta">運営　' + when + '</div>' +
          '</div>'
        );
      }

      if (m.kind === 'delivery') {
        return (
          '<div class="msg-row" style="align-items:flex-start;">' +
            '<div class="delivery-card">' +
              '<div style="display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800; color:#3f9457;">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3f9457" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V7a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 7v10a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 17v-1"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg>' +
                '納品のお知らせ' +
              '</div>' +
              '<div style="font-size:12px; color:#4b5a61; line-height:1.6;">' + escapeHtml(m.body) + '</div>' +
            '</div>' +
            '<div class="meta">運営　' + when + '</div>' +
          '</div>'
        );
      }

      // 通常のテキストメッセージ
      var mine = (m.sender === 'member');
      return (
        '<div class="msg-row" style="align-items:' + (mine ? 'flex-end' : 'flex-start') + ';">' +
          '<div class="bubble ' + (mine ? 'mine' : 'theirs') + '">' + escapeHtml(m.body) + '</div>' +
          '<div class="meta">' + (mine ? 'あなた' : '運営') + '　' + when + (m.edited_at ? '　（編集済み）' : '') + '</div>' +
        '</div>'
      );
    }).join('');

    container.scrollTop = container.scrollHeight;
  }

  function renderThread(data) {
    currentApplication = data.application;
    document.getElementById('thread-error').style.display = 'none';
    document.getElementById('thread-wrap').style.display = 'flex';

    document.getElementById('thread-title').textContent = data.application.title;
    document.getElementById('thread-started').textContent = '相談開始：' + formatDate(data.application.created_at);

    var style = STATUS_STYLE[data.application.status] || { bg: '#eef2f4', color: '#8fa2ac' };
    var pill = document.getElementById('status-pill');
    pill.textContent = data.application.status;
    pill.style.background = style.bg;
    pill.style.color = style.color;

    renderMessages(data.messages, data.application);
  }

  function loadThread() {
    AuthHelpers.callFunction('member-data', { method: 'GET', query: { thread: applicationId } }).then(renderThread).catch(function (err) {
      showError('読み込みに失敗しました：' + err.message);
    });
  }

  function sendMessage() {
    var input = document.getElementById('send-input');
    var text = input.value.trim();
    if (!text) return;
    var btn = document.getElementById('send-btn');
    btn.classList.add('disabled');
    AuthHelpers.callFunction('member-data', { method: 'POST', body: { action: 'send-message', application_id: Number(applicationId), body: text } })
      .then(function () {
        input.value = '';
        autoResizeInput();
        btn.classList.remove('disabled');
        loadThread();
      })
      .catch(function (err) {
        btn.classList.remove('disabled');
        alert('送信に失敗しました：' + err.message);
      });
  }

  function autoResizeInput() {
    var input = document.getElementById('send-input');
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  function renderSendHint() {
    var isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent || '');
    var ctrlLabel = isMac ? '⌘' : 'Ctrl';
    document.getElementById('send-hint').innerHTML =
      '<span class="kbd">Enter</span> で改行　<span class="kbd">' + ctrlLabel + '</span>+<span class="kbd">↵</span> で送信';
  }

  function acceptQuote() {
    AuthHelpers.callFunction('member-data', { method: 'POST', body: { action: 'accept-quote', application_id: Number(applicationId) } })
      .then(loadThread)
      .catch(function (err) {
        alert('正式受付に失敗しました：' + err.message);
      });
  }

  document.getElementById('send-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      sendMessage();
    }
  });
  document.getElementById('send-input').addEventListener('input', autoResizeInput);
  renderSendHint();

  function updateNavBadge() {
    AuthHelpers.callFunction('member-data', { method: 'GET' }).then(function (data) {
      var total = (data.applications || []).reduce(function (sum, a) { return sum + (a.unread_count || 0); }, 0);
      var badge = document.getElementById('nav-badge-history');
      if (total > 0) {
        badge.textContent = total;
        badge.style.display = 'inline-flex';
      } else {
        badge.style.display = 'none';
      }
    }).catch(function () {});
  }

  if (window.netlifyIdentity) {
    netlifyIdentity.on('init', function (user) {
      if (!user || !window.AuthHelpers) return;
      if (!applicationId) {
        showError('表示する申請が指定されていません。申請履歴から選び直してください。');
        return;
      }
      loadThread();
      updateNavBadge();
    });
  }
</script>

</div>
