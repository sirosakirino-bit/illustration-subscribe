<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>申請管理｜[サイト名] 管理画面</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(circle, #e3f0f7 1px, transparent 1px) 0 0/26px 26px, linear-gradient(180deg, #eef8fd 0%, #f7fbff 100%); font-family: 'M PLUS Rounded 1c', system-ui, sans-serif; color: #3b454a; line-height: 1.9; min-height: 100vh; }
  a { color: #2f9bd6; text-decoration: none; }
  .page { width: 100%; max-width: 900px; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 36px; flex-wrap: wrap; gap: 10px; }
  .navlinks { display: flex; gap: 8px; font-size: 12.5px; font-weight: 700; flex-wrap: wrap; }
  .navlinks > a { padding: 8px 14px; }
  .nav-toggle-btn { display: none; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: #eaf6fb; cursor: pointer; flex-shrink: 0; }
  .nav-active { background: #ffffff; color: #2f9bd6; border-radius: 999px; box-shadow: 0 2px 6px rgba(47,155,214,0.15); }
  .nav-inactive { color: #8fa2ac; }
  .row-link { display: flex; align-items: center; padding: 14px 0; font-size: 13px; color: inherit; text-decoration: none; }
  .request-row { cursor: pointer; }
  .request-row:hover { background: #f7fbff; }

  @media (max-width: 480px) {
    .topbar { padding: 16px 18px; }
    .topbar > div:first-child { order: 1; }
    .topbar > div:last-child { order: 2; }
    .topbar > div:last-child > div:last-child { display: none; }
    .navlinks { order: 3; flex-basis: 100%; font-size: 11px; gap: 4px; }
    .navlinks > a { padding: 6px 9px; }
  }

  @media (max-width: 480px) {
    .topbar { padding: 16px 18px; position: relative; }
    .topbar > div:first-child { order: 1; }
    .topbar > div:last-child { order: 2; }
    .topbar > div:last-child > div:last-child { display: none; }
    .user-name-row { display: none; }
    .nav-toggle-btn { display: flex; order: 3; }
    .navlinks { display: none; }
    .topbar.nav-open .navlinks {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: calc(100% + 6px);
      left: 18px;
      right: 18px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(47,155,214,0.22);
      padding: 8px;
      gap: 2px;
      z-index: 60;
    }
    .topbar.nav-open .navlinks > a {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 10px;
    }
    .topbar.nav-open .nav-active { box-shadow: none; }
  }
</style>
</head>
<body data-require-auth>
<div class="page">

  <div class="topbar">
    <div style="font-size: 20px; font-weight: 800; color: #2f9bd6;"><a href="admin-members.html" style="color:#2f9bd6;">[サイト名] 管理画面</a></div>
    <div class="nav-toggle-btn" onclick="toggleMobileNav()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f9bd6" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
    <div class="navlinks">
      <a href="admin-members.html" class="nav-inactive">会員一覧</a>
      <a href="admin-capacity.html" class="nav-inactive">制作枠</a>
      <a href="admin-requests.html" class="nav-active">申請管理</a>
      <a href="admin-inbox.html" class="nav-inactive" style="display: flex; align-items: center; gap: 5px;">メッセージ<span style="display: inline-flex; align-items: center; justify-content: center; min-width: 14px; height: 14px; padding: 0 4px; background: #c0524f; color: #fff; font-size: 9px; font-weight: 800; border-radius: 999px;">1</span></a>
      <a href="admin-payments.html" class="nav-inactive">決済状況</a>
      <a href="admin-announce.html" class="nav-inactive">お知らせ配信</a>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: #5c6b73;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #d6f0fb; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #1f7fb3;">運</div>
      <div>あなた（運営）</div>
    </div>
  </div>

  <div style="padding: 4px 36px 36px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1;">

    <div style="font-size: 20px; font-weight: 800;">申請管理</div>
    <div style="font-size: 12px; color: #9db0b8;">申請日時順に表示しています。「ヒアリング中」は内容を確認して確定ポイント数を入力し「正式受付」へ、「制作中」は納品が終わったら「納品済みにする」を押してください。</div>

    <div id="requests-error" style="display:none; background:#fbecec; border:1px solid #f3d3d3; color:#c0524f; font-size:12px; padding:10px 16px; border-radius:12px;"></div>

    <div style="background: #ffffff; border-radius: 18px; padding: 8px 26px; box-shadow: 0 3px 10px rgba(47,155,214,0.08); display: flex; flex-direction: column; overflow-x: auto;">

      <div style="display: flex; align-items: center; padding: 14px 0; border-bottom: 1px solid #eef2f4; font-size: 11px; font-weight: 700; color: #9db0b8; gap: 10px; flex-wrap: nowrap; min-width: 600px;">
        <div style="width: 56px; flex-shrink: 0;">申請日</div>
        <div style="width: 84px; flex-shrink: 0;">会員</div>
        <div style="flex: 1 1 auto; min-width: 0;">依頼内容</div>
        <div style="width: 46px; flex-shrink: 0;">pt数</div>
        <div style="width: 86px; flex-shrink: 0;">ステータス</div>
        <div style="flex-shrink: 0;">操作</div>
      </div>

      <div id="request-rows">
        <div style="padding: 20px 0; font-size: 12px; color: #9db0b8; text-align: center;">読み込み中…</div>
      </div>

    </div>

  </div>
</div>
<script>
  function toggleMobileNav() {
    var topbar = document.querySelector('.topbar');
    if (topbar) topbar.classList.toggle('nav-open');
  }
  document.addEventListener('click', function (e) {
    var topbar = document.querySelector('.topbar');
    if (topbar && topbar.classList.contains('nav-open') && !topbar.contains(e.target)) {
      topbar.classList.remove('nav-open');
    }
  });
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="auth.js"></script>
<script>
  var STATUS_STYLE = {
    'ヒアリング中': { bg: '#f1eefb', color: '#6a4fc0' },
    '制作中': { bg: '#fff0da', color: '#b3791a' },
    '対応完了': { bg: '#e6f7ea', color: '#3f9457' },
    'キャンセル': { bg: '#eef2f4', color: '#8fa2ac' }
  };

  function formatDate(iso) {
    var d = new Date(iso);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  function showError(msg) {
    var box = document.getElementById('requests-error');
    box.textContent = msg;
    box.style.display = 'block';
  }

  // 行内の入力欄・ボタン・取消リンクをクリックしたときはメッセージ画面へ飛ばさず、
  // それ以外（会員名や依頼内容など）をクリックしたときだけメッセージ画面に移動する
  function handleRowClick(e, appId) {
    if (e.target.closest('input, [data-action-accept], [data-action-complete], [data-action-cancel]')) return;
    location.href = 'admin-inbox.html#' + appId;
  }

  function renderRequests(applications) {
    var container = document.getElementById('request-rows');
    if (!applications.length) {
      container.innerHTML = '<div style="padding: 20px 0; font-size: 12px; color: #9db0b8; text-align: center;">まだ申請はありません</div>';
      return;
    }
    container.innerHTML = applications.map(function (app, i) {
      var style = STATUS_STYLE[app.status] || { bg: '#eef2f4', color: '#8fa2ac' };
      var border = (i < applications.length - 1) ? 'border-bottom: 1px dashed #eef2f4;' : '';
      var ptText = app.point_cost != null ? (app.point_cost + 'pt') : ('目安' + (app.point_estimate || '相談中'));
      var action = '';
      var cancelLink = '';
      if (app.status === 'ヒアリング中') {
        action = (
          '<input type="number" min="1" step="1" placeholder="pt数" data-pt-input="' + app.id + '" style="width: 46px; flex-shrink: 0; padding: 7px 4px; border: 1px solid #dcedf5; border-radius: 8px; font-size: 11.5px; font-family: inherit; text-align: center; box-sizing: border-box;">' +
          '<div data-action-accept="' + app.id + '" style="background: #2f9bd6; color: #fff; font-weight: 700; font-size: 10.5px; padding: 7px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; flex-shrink: 0;">正式受付</div>'
        );
        cancelLink = '<div data-action-cancel="' + app.id + '" style="font-size: 10px; font-weight: 700; color: #c0524f; cursor: pointer; white-space: nowrap; text-decoration: underline; flex-shrink: 0;">取消</div>';
      } else if (app.status === '制作中') {
        action = '<div data-action-complete="' + app.id + '" style="background: #3f9457; color: #fff; font-weight: 700; font-size: 10.5px; padding: 7px 10px; border-radius: 999px; cursor: pointer; white-space: nowrap; flex-shrink: 0;">納品済みにする</div>';
      } else {
        action = '<div style="font-size: 11px; color: #9db0b8; white-space: nowrap;">' + (app.status === 'キャンセル' ? '取消済み' : '完了') + '</div>';
      }
      return (
        '<div class="request-row" data-row-id="' + app.id + '" onclick="handleRowClick(event, ' + app.id + ')" style="display: flex; align-items: center; padding: 14px 0; ' + border + ' font-size: 13px; gap: 10px; flex-wrap: nowrap; min-width: 600px;">' +
          '<div style="width: 56px; flex-shrink: 0; color: #9db0b8;">' + formatDate(app.created_at) + '</div>' +
          '<div style="width: 84px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + app.member_display_name + '</div>' +
          '<div style="flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + app.title + '</div>' +
          '<div style="width: 46px; flex-shrink: 0; color: #4b5a61; font-size: 11.5px;">' + ptText + '</div>' +
          '<div style="width: 86px; flex-shrink: 0;"><span style="font-size: 10.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: ' + style.bg + '; color: ' + style.color + '; white-space: nowrap;">' + app.status + '</span></div>' +
          '<div style="flex-shrink: 0; display: flex; align-items: center; gap: 5px; flex-wrap: nowrap;">' + action + cancelLink + '</div>' +
        '</div>'
      );
    }).join('');

    container.querySelectorAll('[data-action-accept]').forEach(function (el) {
      el.addEventListener('click', function () {
        var id = Number(el.getAttribute('data-action-accept'));
        var input = container.querySelector('[data-pt-input="' + id + '"]');
        var pt = Number(input.value);
        if (!pt || pt < 1) { showError('確定ポイント数を入力してください。'); return; }
        document.getElementById('requests-error').style.display = 'none';
        AuthHelpers.callFunction('admin-data', { method: 'POST', body: { action: 'advance-status', application_id: id, new_status: '制作中', point_cost: pt } })
          .then(loadData)
          .catch(function (err) { showError('正式受付に失敗しました：' + err.message); });
      });
    });
    container.querySelectorAll('[data-action-complete]').forEach(function (el) {
      el.addEventListener('click', function () {
        var id = Number(el.getAttribute('data-action-complete'));
        document.getElementById('requests-error').style.display = 'none';
        AuthHelpers.callFunction('admin-data', { method: 'POST', body: { action: 'advance-status', application_id: id, new_status: '対応完了' } })
          .then(loadData)
          .catch(function (err) { showError('更新に失敗しました：' + err.message); });
      });
    });
    container.querySelectorAll('[data-action-cancel]').forEach(function (el) {
      el.addEventListener('click', function () {
        var id = Number(el.getAttribute('data-action-cancel'));
        if (!confirm('この申請を取り消します。よろしいですか？')) return;
        document.getElementById('requests-error').style.display = 'none';
        AuthHelpers.callFunction('admin-data', { method: 'POST', body: { action: 'cancel-application', application_id: id } })
          .then(loadData)
          .catch(function (err) { showError('取り消しに失敗しました：' + err.message); });
      });
    });
  }

  function loadData() {
    AuthHelpers.callFunction('admin-data', { method: 'GET' }).then(function (data) {
      renderRequests(data.applications);
    }).catch(function (err) {
      document.getElementById('request-rows').innerHTML = '<div style="padding: 20px 0; font-size: 12px; color: #c0524f; text-align: center;">読み込みに失敗しました：' + err.message + '</div>';
    });
  }

  if (window.netlifyIdentity) {
    netlifyIdentity.on('init', function (user) {
      if (!user || !window.AuthHelpers) return;
      loadData();
    });
  }
</script>

</div>
</body>
</html>
