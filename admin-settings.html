<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>設定｜Xovy Studio 管理画面</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Dela+Gothic+One&display=swap">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="favicon-180.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<style>
  /* サイト全体で表示されるスクロールバーの配色を統一（水色） */
  *::-webkit-scrollbar { width: 9px; height: 9px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: #cfe6f1; border-radius: 999px; }
  *::-webkit-scrollbar-thumb:hover { background: #9ed2ea; }
  html { scrollbar-width: thin; scrollbar-color: #cfe6f1 transparent; }

  @font-face { font-family: 'GenEi Kiwami Gothic'; src: url('fonts/GenEiKiwamiGo.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(circle, #c9e2ef 1px, transparent 1px) 0 0/26px 26px, linear-gradient(180deg, #eef8fd 0%, #f7fbff 100%); font-family: 'Kosugi Maru', system-ui, sans-serif; color: #3b454a; line-height: 1.85; letter-spacing: 0.2px; text-rendering: optimizeLegibility; min-height: 100vh; }
  a { color: #2f9bd6; text-decoration: none; }
  .page { width: 100%; max-width: 900px; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 36px; flex-wrap: nowrap; gap: 10px; width: 100vw; position: relative; left: 50%; margin-left: -50vw; box-sizing: border-box; }
  .navlinks { display: flex; gap: 3px; font-size: 12px; font-weight: 700; flex-wrap: wrap; flex: 0 1 auto; min-width: 0; }
  .navlinks > a { padding: 8px 10px; }
  .nav-toggle-btn { display: none; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: #eaf6fb; cursor: pointer; flex-shrink: 0; }
  .nav-active { background: #ffffff; color: #2f9bd6; border-radius: 999px; box-shadow: 0 2px 6px rgba(47,155,214,0.15); }
  .nav-inactive { color: #5c6b73; }
  .admin-user-info { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: #5c6b73; flex-shrink: 0; white-space: nowrap; }

  @media (max-width: 820px) {
    .topbar { padding: 16px 18px; position: relative; }
    .topbar > div:first-child { order: 1; }
    .topbar > div:last-child { order: 2; }
    .topbar > div:last-child { display: none; }
    .admin-user-info { display: none; }
    .user-name-row { display: none; }
    .nav-toggle-btn { display: flex; order: 3; }
    .navlinks { display: none; }
    .topbar.nav-open .navlinks {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: calc(100% + 6px);
      left: 18px;
      right: 18px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(47,155,214,0.22);
      padding: 8px;
      gap: 2px;
      z-index: 60;
    }
    .topbar.nav-open .navlinks > a {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 10px;
    }
    .topbar.nav-open .nav-active { box-shadow: none; }
  }
</style>
</head>
<body data-require-auth>
<div class="page">

  <div class="topbar">
    <div style="font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-size: 20px; font-weight: 800; font-weight: 400; color: #2f9bd6; flex-shrink: 0; white-space: nowrap;"><a href="admin-members.html" style="display:flex;align-items:center;gap:6px;color:#2f9bd6;"><img src="logo-icon.png" alt="" style="height:36px;width:auto;display:block;">Xovy Studio 管理画面</a></div>
    <div class="nav-toggle-btn" onclick="toggleMobileNav()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f9bd6" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
    <div class="navlinks">
      <a href="admin-members.html" class="nav-inactive">会員一覧</a>
      <a href="admin-capacity.html" class="nav-inactive">制作枠</a>
      <a href="admin-requests.html" class="nav-inactive">申請管理</a>
      <a href="admin-inbox.html" class="nav-inactive" style="display: flex; align-items: center; gap: 5px;">メッセージ<span style="display: inline-flex; align-items: center; justify-content: center; min-width: 14px; height: 14px; padding: 0 4px; background: #c0524f; color: #fff; font-size: 9px; font-weight: 800; border-radius: 999px;">1</span></a>
      <a href="admin-payments.html" class="nav-inactive">決済状況</a>
      <a href="admin-announce.html" class="nav-inactive">お知らせ配信</a>
    </div>
    <a href="admin-settings.html" class="admin-user-info" style="text-decoration: none;">
      <div data-admin-icon style="width: 32px; height: 32px; border-radius: 50%; background: #d6f0fb; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #1f7fb3; overflow: hidden; flex-shrink: 0;">運</div>
      <div style="white-space: nowrap;">あなた（運営）</div>
    </a>
  </div>

  <div style="padding: 4px 36px 36px; display: flex; flex-direction: column; gap: 16px; flex-grow: 1;">

    <div style="font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-size: 20px; font-weight: 800; font-weight: 400;">設定</div>

    <div style="background: #ffffff; border-radius: 18px; padding: 24px 26px; box-shadow: 0 3px 10px rgba(47,155,214,0.08); display: flex; flex-direction: column; gap: 16px;">
      <div style="font-size: 13px; font-weight: 800;">運営アイコン</div>
      <div style="display: flex; align-items: center; gap: 18px; border-top: 1px solid #eef2f4; padding-top: 14px; flex-wrap: wrap;">
        <div id="avatar-preview" data-admin-icon style="width: 64px; height: 64px; border-radius: 50%; background: #d6f0fb; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #1f7fb3; flex-shrink: 0; overflow: hidden;">運</div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <label style="border: 1px solid #dcedf5; border-radius: 999px; padding: 8px 18px; font-size: 12px; font-weight: 700; color: #2f9bd6; cursor: pointer;">
              画像を変更する
              <input id="avatar-file-input" type="file" accept="image/*" style="display: none;">
            </label>
            <div id="avatar-remove-btn" style="border: 1px solid #f3d7d7; border-radius: 999px; padding: 8px 18px; font-size: 12px; font-weight: 700; color: #c0524f; cursor: pointer;">削除する</div>
          </div>
          <div id="avatar-status" style="font-size: 11px; color: #5c6b73; min-height: 14px;"></div>
        </div>
      </div>
      <div style="font-size: 11px; color: #5c6b73; border-top: 1px solid #eef2f4; padding-top: 12px;">ここで設定したアイコンは、会員に送るメッセージなど運営として表示される箇所に反映されます。</div>
    </div>

    <div style="background: #ffffff; border-radius: 18px; padding: 24px 26px; box-shadow: 0 3px 10px rgba(47,155,214,0.08); display: flex; flex-direction: column; gap: 16px;">
      <div style="font-size: 13px; font-weight: 800;">アカウント情報</div>
      <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #eef2f4; padding-top: 14px;">
        <div>
          <div style="font-size: 11px; color: #5c6b73;">メールアドレス</div>
          <div style="font-size: 13px; margin-top: 3px;" data-user-email>you@example.com</div>
        </div>
        <a href="#" data-action="logout" style="font-size: 12px; color: #5c6b73; font-weight: 700; border: 1px solid #dcedf5; border-radius: 999px; padding: 8px 18px; flex-shrink: 0;">ログアウト</a>
      </div>
    </div>

  </div>
</div>
<div style="text-align: center; padding: 18px 36px 14px; font-size: 10.5px; color: #b3c2c9;">
  &copy; 2026 Xovy Studio&#12288;<a href="legal.html" style="color: #5c6b73; text-decoration: underline;">利用規約・プライバシーポリシー・特定商取引法に基づく表記</a>
</div>
<script>
  function toggleMobileNav() {
    var topbar = document.querySelector('.topbar');
    if (topbar) topbar.classList.toggle('nav-open');
  }
  document.addEventListener('click', function (e) {
    var topbar = document.querySelector('.topbar');
    if (topbar && topbar.classList.contains('nav-open') && !topbar.contains(e.target)) {
      topbar.classList.remove('nav-open');
    }
  });

  document.getElementById('avatar-file-input').addEventListener('change', function (e) {
    var file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var status = document.getElementById('avatar-status');
    status.style.color = '#5c6b73';
    status.textContent = 'アップロード中…';
    AuthHelpers.setAvatar(file).then(function () {
      status.style.color = '#3f9457';
      status.textContent = '保存しました';
    }).catch(function (err) {
      status.style.color = '#c0524f';
      status.textContent = '保存に失敗しました：' + err.message;
    });
  });

  document.getElementById('avatar-remove-btn').addEventListener('click', function () {
    var status = document.getElementById('avatar-status');
    status.style.color = '#5c6b73';
    status.textContent = '削除中…';
    AuthHelpers.removeAvatar().then(function () {
      status.style.color = '#3f9457';
      status.textContent = '削除しました';
    }).catch(function (err) {
      status.style.color = '#c0524f';
      status.textContent = '削除に失敗しました：' + err.message;
    });
  });
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="auth.js"></script>
</body>
</html>
