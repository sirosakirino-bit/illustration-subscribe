<style>

  @font-face { font-family: 'Kosugi Maru'; src: url('fonts/KosugiMaru-Regular.woff') format('woff'), url('fonts/KosugiMaru-Regular.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: optional; }

  html, body { margin: 0; min-height: 100%; }

  a:hover { color: #1f7fb3; }
  .page { width: 100%; max-width: 900px; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }
  .logo-bar { display:flex; align-items:center; gap:6px; width: 100%; padding: 26px 36px; font-size: 20px; font-weight: 800; color: #2f9bd6;  font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-weight: 400;}
  .card { width: 420px; max-width: calc(100% - 40px); background: #ffffff; border-radius: 20px; padding: 34px 36px; margin-top: 60px; box-shadow: 0 4px 14px rgba(47,155,214,0.10); display: flex; flex-direction: column; gap: 22px; }
  .field-input { border: 1px solid #dcedf5; border-radius: 10px; padding: 11px 14px; font-size: 13px; color: #3b454a; font-family: inherit; width: 100%; outline: none; }
  .field-input::placeholder { color: #b3c2c9; }
  .field-input:focus { border-color: #2f9bd6; }
  .btn-primary { display: block; background: #2f9bd6; color: #fff; font-weight: 700; font-size: 13px; padding: 13px 0; border: none; border-radius: 999px; text-align: center; box-shadow: 0 4px 12px rgba(47,155,214,0.3); cursor: pointer; font-family: inherit; width: 100%; }

<body data-guest-only>
<div class="page">

  <div class="logo-bar"><img src="logo-icon.png" alt="" style="height:36px;width:auto;display:block;">Xovy Studio ✧</div>

  <div class="card">

    <div style="font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-size: 17px; font-weight: 800; font-weight: 400;">ログイン</div>

    <div style="font-size: 11.5px; color: #5c6b73;">「ログインする」を押すと、ログイン用の小さいウィンドウが開きます。そちらにメールアドレスとパスワードを入力してください。</div>

    <div data-auth-error style="display:none; font-size: 11.5px; color: #c0524f; font-weight: 700; background:#fdecec; border-radius: 10px; padding: 10px 12px;"></div>

    <button type="button" class="btn-primary" data-action="open-login">ログインする</button>

    <a href="#" data-action="open-login" style="font-size: 12px; font-weight: 700; text-align: center;">パスワードをお忘れの方はこちら</a>

    <div style="font-size: 10.5px; color: #5c6b73; background: #f7fbff; border-radius: 10px; padding: 10px 14px;">お知らせメールが届かない場合は、迷惑メールフォルダに振り分けられていないかご確認ください。</div>

    <div style="border-top: 1px solid #eef2f4; padding-top: 18px; font-size: 12px; color: #5c6b73; text-align: center;">
      初めての方はこちら　<a href="signup-plan.html" style="font-weight: 700;">新規登録</a>
