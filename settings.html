<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<link rel="preload" as="font" type="font/woff" href="fonts/KosugiMaru-Regular.woff" crossorigin>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">

<style>
  /* サイト全体で表示されるスクロールバーの配色を統一（水色） */
  *::-webkit-scrollbar { width: 9px; height: 9px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: #cfe6f1; border-radius: 999px; }
  *::-webkit-scrollbar-thumb:hover { background: #9ed2ea; }
  html { scrollbar-width: thin; scrollbar-color: #cfe6f1 transparent; }

  @font-face { font-family: 'GenEi Kiwami Gothic'; src: url('fonts/GenEiKiwamiGo.woff') format('woff'), url('fonts/GenEiKiwamiGo.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: fallback; }
  @font-face { font-family: 'Kosugi Maru'; src: url('fonts/KosugiMaru-Regular.woff') format('woff'), url('fonts/KosugiMaru-Regular.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: fallback; }
  @font-face { font-family: 'Dela Gothic One'; src: url('fonts/DelaGothicOne-Regular.woff') format('woff'), url('fonts/DelaGothicOne-Regular.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: fallback; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(circle, #c9e2ef 1px, transparent 1px) 0 0/26px 26px, linear-gradient(180deg, #eef8fd 0%, #f7fbff 100%); font-family: 'Kosugi Maru', system-ui, sans-serif; color: #3b454a; line-height: 1.85; letter-spacing: 0.2px; text-rendering: optimizeLegibility; min-height: 100vh; }
  a { color: #2f9bd6; text-decoration: none; }
  .page { width: 100%; max-width: 1100px; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 36px; flex-wrap: nowrap; gap: 10px; }
  .logo { font-size: 20px; font-weight: 800; color: #2f9bd6;  font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-weight: 400; flex-shrink: 0; white-space: nowrap;}
  .navlinks { display: flex; gap: 10px; font-size: 13px; font-weight: 700; flex-wrap: wrap; flex: 0 1 auto; min-width: 0; }
  .navlinks > a { padding: 8px 16px; }
  .nav-toggle-btn { display: none; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: #eaf6fb; cursor: pointer; flex-shrink: 0; }
  .nav-active { background: #ffffff; color: #2f9bd6; border-radius: 999px; box-shadow: 0 2px 6px rgba(47,155,214,0.15); }
  .nav-inactive { color: #5c6b73; }
  .navlinks > a[data-action="logout"] { display: none; }
  .user { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: #5c6b73; flex-shrink: 0; white-space: nowrap; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #d6f0fb; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #1f7fb3; }

  @media (max-width: 1010px) {
    .topbar { padding: 16px 18px; position: relative; justify-content: flex-start; }
    .topbar > div:first-child { order: 1; }
    .topbar > div:last-child { order: 2; }
    .topbar > div:last-child { display: flex; flex-shrink: 0; gap: 6px; order: 2; margin-left: auto; }
    .avatar { flex-shrink: 0; }
    .nav-toggle-btn { display: flex; order: 3; }
    .navlinks { display: none; }
    .topbar.nav-open .navlinks {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: calc(100% + 6px);
      left: 18px;
      right: 18px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(47,155,214,0.22);
      padding: 8px;
      gap: 2px;
      z-index: 60;
    }
    .topbar.nav-open .navlinks > a {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 10px;
    }
    .topbar.nav-open .nav-active { box-shadow: none; }
  }

  @media (max-width: 650px) {
    .user-name-row { display: none; }
    .user > a[data-action="logout"] { display: none; }
    .topbar.nav-open .navlinks > a[data-action="logout"] { display: block; border-top: 1px solid #eef2f4; margin-top: 4px; padding-top: 14px; }
  }

  @media (max-width: 480px) {
    .topbar { padding: 16px 12px; gap: 6px; }
    .avatar { width: 28px; height: 28px; }
  }
</style>
</head>
<body data-require-auth>

  <div class="topbar">

    <div class="nav-toggle-btn" onclick="toggleMobileNav()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f9bd6" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
    <div class="navlinks">
      <a href="mypage.html" class="nav-inactive">マイページ</a>

      <a href="history.html" class="nav-inactive" style="display: flex; align-items: center; gap: 6px;">申請履歴<span style="display: inline-flex; align-items: center; justify-content: center; min-width: 15px; height: 15px; padding: 0 4px; background: #c0524f; color: #fff; font-size: 9px; font-weight: 800; border-radius: 999px;">2</span></a>

      <a href="#" data-action="logout" class="nav-inactive">ログアウト</a>
    </div>
    <div class="user">
      <div class="avatar" data-user-initial>A</div>
      <div class="user-name-row"><span data-user-name>[会員名]</span> さん</div>
      <a href="#" data-action="logout" style="font-size: 11px; color: #5c6b73; font-weight: 700;">ログアウト</a>
    </div>
  </div>

  <div style="padding: 8px 36px 36px; display: flex; flex-direction: column; gap: 18px; flex-grow: 1;">

    <div style="font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-size: 20px; font-weight: 800; font-weight: 400;">設定</div>

    <div style="background: #ffffff; border-radius: 18px; padding: 24px 26px; box-shadow: 0 3px 10px rgba(47,155,214,0.08); display: flex; flex-direction: column; gap: 16px;">
      <div style="font-size: 13px; font-weight: 800;">プロフィールアイコン</div>
      <div style="display: flex; align-items: center; gap: 18px; border-top: 1px solid #eef2f4; padding-top: 14px; flex-wrap: wrap;">
        <div id="avatar-preview" data-user-initial style="width: 64px; height: 64px; border-radius: 50%; background: #d6f0fb; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #1f7fb3; flex-shrink: 0; overflow: hidden;">A</div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <label style="border: 1px solid #dcedf5; border-radius: 999px; padding: 8px 18px; font-size: 12px; font-weight: 700; color: #2f9bd6; cursor: pointer;">
              画像を変更する
              <input id="avatar-file-input" type="file" accept="image/*" style="display: none;">
            </label>
            <div id="avatar-remove-btn" style="border: 1px solid #f3d7d7; border-radius: 999px; padding: 8px 18px; font-size: 12px; font-weight: 700; color: #c0524f; cursor: pointer;">削除する</div>
          </div>
          <div id="avatar-status" style="font-size: 11px; color: #5c6b73; min-height: 14px;"></div>

    </div>

    <div style="background: #ffffff; border-radius: 18px; padding: 24px 26px; box-shadow: 0 3px 10px rgba(47,155,214,0.08); display: flex; flex-direction: column; gap: 16px;">
      <div style="font-size: 13px; font-weight: 800;">アカウント情報</div>
      <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #eef2f4; padding-top: 14px;">
        <div>
          <div style="font-size: 11px; color: #5c6b73;">メールアドレス</div>
          <div style="font-size: 13px; margin-top: 3px;" data-user-email>you@example.com</div>
        </div>
        <div style="font-size: 12px; color: #2f9bd6; font-weight: 700;">変更する</div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #eef2f4; padding-top: 14px;">
        <div>
          <div style="font-size: 11px; color: #5c6b73;">パスワード</div>
          <div style="font-size: 13px; margin-top: 3px;">••••••••</div>
        </div>
        <div style="font-size: 12px; color: #2f9bd6; font-weight: 700;">変更する</div>
      </div>
    </div>

    <div style="background: #ffffff; border-radius: 18px; padding: 24px 26px; box-shadow: 0 3px 10px rgba(47,155,214,0.08); display: flex; flex-direction: column; gap: 16px;">
      <div style="font-size: 13px; font-weight: 800;">ご契約プラン・お支払い</div>
      <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #eef2f4; padding-top: 14px;">
        <div>
          <div style="font-size: 11px; color: #5c6b73;">現在のプラン</div>

      <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #eef2f4; padding-top: 14px;">
        <div>
          <div id="billing-label" style="font-size: 11px; color: #5c6b73;">次回請求日</div>
          <div id="billing-value" style="font-size: 13px; margin-top: 3px;">ー</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid #eef2f4; padding-top: 14px;">
        <div>
          <div style="font-size: 11px; color: #5c6b73;">お支払い方法</div>
          <div id="card-info" style="font-size: 13px; margin-top: 3px;">ー</div>

      <div style="display: flex; gap: 12px; margin-top: 4px;">
        <a href="plan-change.html" style="flex-grow: 1; border: 1px solid #dcedf5; border-radius: 12px; padding: 12px; text-align: center; font-size: 12px; font-weight: 700; color: #5c6b73;">プランを変更する</a>

<script>
  function toggleMobileNav() {
    var topbar = document.querySelector('.topbar');
    if (topbar) topbar.classList.toggle('nav-open');
  }
  document.addEventListener('click', function (e) {
    var topbar = document.querySelector('.topbar');
    if (topbar && topbar.classList.contains('nav-open') && !topbar.contains(e.target)) {
      topbar.classList.remove('nav-open');
    }
  });

  document.getElementById('avatar-file-input').addEventListener('change', function (e) {
    var file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    var status = document.getElementById('avatar-status');
    status.style.color = '#5c6b73';
    status.textContent = 'アップロード中…';
    AuthHelpers.setAvatar(file).then(function () {
      status.style.color = '#3f9457';
      status.textContent = '保存しました';
    }).catch(function (err) {
      status.style.color = '#c0524f';
      status.textContent = '保存に失敗しました：' + err.message;
    });
  });

  document.getElementById('avatar-remove-btn').addEventListener('click', function () {
    var status = document.getElementById('avatar-status');
    status.style.color = '#5c6b73';
    status.textContent = '削除中…';
    AuthHelpers.removeAvatar().then(function () {
      status.style.color = '#3f9457';
      status.textContent = '削除しました';
    }).catch(function (err) {
      status.style.color = '#c0524f';
      status.textContent = '削除に失敗しました：' + err.message;
    });
  });
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="auth.js"></script>
<script>
  var PLAN_LABELS = { point: 'ポイントプラン', monthly: '月1プラン' };
  var PLAN_AMOUNTS = { point: '10,000円＋消費税10%', monthly: '25,000円＋消費税10%' };
  var PAYMENT_STATUS_BADGES = {
    pending: { label: '決済手続き待ち', bg: '#eef2f4', color: '#8fa2ac' },
    active: { label: '利用中', bg: '#e6f7ea', color: '#3f9457' },
    past_due: { label: '支払い失敗・リトライ中', bg: '#fbecec', color: '#c0524f' },
    paused: { label: '休止中', bg: '#fff0da', color: '#b3791a' },
    canceled: { label: '解約済み', bg: '#eef2f4', color: '#8fa2ac' }
  };

  function formatDateSlash(iso) {
    var d = new Date(iso);
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  }

  function showPaymentError(msg) {
    var box = document.getElementById('payment-error');
    if (!msg) { box.style.display = 'none'; return; }
    box.textContent = msg;
    box.style.display = 'block';
  }

  function renderPaymentInfo(member) {
    document.getElementById('plan-name').textContent = (PLAN_LABELS[member.plan] || member.plan) + '（月額' + (PLAN_AMOUNTS[member.plan] || '') + '）';

    var badge = PAYMENT_STATUS_BADGES[member.payment_status] || { label: member.payment_status, bg: '#eef2f4', color: '#8fa2ac' };
    var badgeEl = document.getElementById('plan-status-badge');
    badgeEl.textContent = badge.label;
    badgeEl.style.background = badge.bg;
    badgeEl.style.color = badge.color;

    var billingLabel = document.getElementById('billing-label');
    var billingValue = document.getElementById('billing-value');
    var amount = (member.plan === 'monthly' ? '27,500' : '11,000') + '円（税込）';

    if (member.payment_status === 'active') {
      billingLabel.textContent = member.leave_requested_at ? '退会予定日' : '次回請求日';
      billingValue.textContent = (member.current_period_end ? formatDateSlash(member.current_period_end) : 'ー') + (member.leave_requested_at ? '' : '／' + amount);
    } else if (member.payment_status === 'pending') {
      billingLabel.textContent = '次回請求日';
      billingValue.textContent = 'お支払い手続きの完了後に確定します';
    } else if (member.payment_status === 'past_due') {
      billingLabel.textContent = '次回請求日';
      billingValue.textContent = '支払い失敗のため自動リトライ中です';
    } else if (member.payment_status === 'paused') {
      billingLabel.textContent = '次回請求日';
      billingValue.textContent = '休止中のためご請求は発生しません';
    } else {
      billingLabel.textContent = '次回請求日';
      billingValue.textContent = 'ー';
    }

    document.getElementById('card-info').textContent = member.card_brand && member.card_last4
      ? ('クレジットカード（下4桁 ' + member.card_last4 + '）')
      : '未登録';
  }

  function loadPaymentInfo() {
    AuthHelpers.callFunction('member-data', { method: 'GET' }).then(function (data) {
      renderPaymentInfo(data.member);
    }).catch(function (err) {
      document.getElementById('plan-name').textContent = '取得に失敗しました';
      showPaymentError(err.message || '会員情報の取得に失敗しました');
    });
  }

  document.getElementById('portal-btn').addEventListener('click', function () {
    showPaymentError('');
    var btn = this;
    var originalText = btn.textContent;
    btn.textContent = '処理しています…';
    AuthHelpers.callFunction('stripe-portal', { method: 'POST' }).then(function (data) {
      if (!data || !data.url) throw new Error('カスタマーポータルの作成に失敗しました');
      location.href = data.url;
    }).catch(function (err) {
      btn.textContent = originalText;
      showPaymentError(err.message || 'カスタマーポータルの作成に失敗しました');
    });
  });

  if (window.netlifyIdentity) {
    netlifyIdentity.on('init', function (user) {
      if (!user) return;
      loadPaymentInfo();
    });
  }
</script>
