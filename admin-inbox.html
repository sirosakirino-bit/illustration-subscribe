<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メッセージ｜[サイト名] 管理画面</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(circle, #e3f0f7 1px, transparent 1px) 0 0/26px 26px, linear-gradient(180deg, #eef8fd 0%, #f7fbff 100%); font-family: 'M PLUS Rounded 1c', system-ui, sans-serif; color: #3b454a; line-height: 1.9; min-height: 100vh; }
  a { color: #2f9bd6; text-decoration: none; }
  .page { width: 100%; max-width: 1320px; min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; }
  .plan-tag { font-size: 8.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; flex-shrink: 0; white-space: nowrap; }
  .plan-tag.point { background: #eaf6fb; color: #1f7fb3; }
  .plan-tag.monthly { background: #f1eefb; color: #6a4fc0; }

  .contact-row.unread { background: #fdf1f0; }
  .contact-row.unread.active { background: #eef8fd; }
  .unread-badge { min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: #c0524f; color: #fff; font-size: 9.5px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .deliver-btn { display: inline-flex; align-items: center; gap: 6px; background: #e6f7ea; color: #3f9457; font-size: 12px; font-weight: 700; padding: 9px 18px; border-radius: 999px; cursor: pointer; align-self: flex-start; }
  .deliver-composer { display: none; flex-direction: column; gap: 12px; background: #f3faf5; border: 1px solid #cfe8d6; border-radius: 14px; padding: 18px 20px; }
  .send-deliver-btn { background: #3f9457; color: #fff; font-weight: 700; font-size: 13px; padding: 11px 22px; border-radius: 999px; text-align: center; cursor: pointer; align-self: flex-start; }
  .deliver-card { background: #f3faf5; border: 1.5px solid #cfe8d6; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; max-width: 440px; align-self: flex-start; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 36px; flex-wrap: wrap; gap: 10px; }
  .navlinks { display: flex; gap: 8px; font-size: 12.5px; font-weight: 700; flex-wrap: wrap; }
  .navlinks > a { padding: 8px 14px; }
  .nav-toggle-btn { display: none; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: #eaf6fb; cursor: pointer; flex-shrink: 0; }
  .nav-active { background: #ffffff; color: #2f9bd6; border-radius: 999px; box-shadow: 0 2px 6px rgba(47,155,214,0.15); }
  .nav-inactive { color: #8fa2ac; }

  .contact-row { display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; border-left: 3px solid transparent; cursor: pointer; }
  .contact-row.active { background: #eef8fd; border-left: 3px solid #2f9bd6; }
  .contact-row:hover { background: #f7fbff; }

  .quote-btn { display: inline-flex; align-items: center; gap: 6px; background: #f1eefb; color: #6a4fc0; font-size: 12px; font-weight: 700; padding: 9px 18px; border-radius: 999px; cursor: pointer; align-self: flex-start; }
  .composer { display: none; flex-direction: column; gap: 12px; background: #f9f7fd; border: 1px solid #e3dcf5; border-radius: 14px; padding: 18px 20px; }
  .send-quote-btn { background: #6a4fc0; color: #fff; font-weight: 700; font-size: 13px; padding: 11px 0; border-radius: 999px; text-align: center; cursor: pointer; align-self: flex-start; padding-left: 22px; padding-right: 22px; }
  .quote-card { background: #f9f7fd; border: 1.5px solid #e3dcf5; border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; max-width: 440px; align-self: flex-start; }
  .pt-input { width: 90px; padding: 9px 10px; border: 1px solid #e3dcf5; border-radius: 10px; font-size: 13px; font-family: inherit; text-align: center; }
  .bubble { font-size: 13px; padding: 12px 16px; max-width: 420px; line-height: 1.6; }
  .bubble.mine { background: #2f9bd6; color: #ffffff; border-radius: 16px 4px 16px 16px; align-self: flex-end; }
  .bubble.theirs { background: #f2f6f7; color: #3b454a; border-radius: 4px 16px 16px 16px; align-self: flex-start; }
  .meta { font-size: 10px; color: #b3c2c9; }
  .msg-row { display: flex; flex-direction: column; gap: 4px; }
  .kbd { background: #eef2f4; border: 1px solid #dcedf5; border-radius: 5px; padding: 1px 6px; font-family: ui-monospace, monospace; color: #5c6b73; }
  .edit-link { color: #2f9bd6; cursor: pointer; text-decoration: underline; }

  .inbox-split { display: flex; gap: 14px; flex-grow: 1; min-height: 740px; }
  .inbox-list { width: 300px; background: #ffffff; border-radius: 18px; box-shadow: 0 3px 10px rgba(47,155,214,0.08); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
  .inbox-thread { flex-grow: 1; background: #ffffff; border-radius: 18px; box-shadow: 0 3px 10px rgba(47,155,214,0.08); display: flex; flex-direction: column; min-width: 0; }
  .thread-back-link { display: none; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: #2f9bd6; cursor: pointer; flex-shrink: 0; }

  @media (max-width: 480px) {
    .topbar { padding: 16px 18px; }
    .topbar > div:first-child { order: 1; }
    .topbar > div:last-child { order: 2; }
    .topbar > div:last-child > div:last-child { display: none; }
    .navlinks { order: 3; flex-basis: 100%; font-size: 11px; gap: 4px; }
    .navlinks > a { padding: 6px 9px; }
  }

  @media (max-width: 760px) {
    .inbox-split { flex-direction: column; min-height: 0; }
    .inbox-list { width: 100%; }
    .inbox-thread { display: none; min-height: 72vh; }
    .thread-back-link { display: flex; }
    body.mobile-thread-open .inbox-list { display: none; }
    body.mobile-thread-open .inbox-thread { display: flex; }
  }

  @media (max-width: 480px) {
    .topbar { padding: 16px 18px; position: relative; }
    .topbar > div:first-child { order: 1; }
    .topbar > div:last-child { order: 2; }
    .topbar > div:last-child > div:last-child { display: none; }
    .user-name-row { display: none; }
    .nav-toggle-btn { display: flex; order: 3; }
    .navlinks { display: none; }
    .topbar.nav-open .navlinks {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: calc(100% + 6px);
      left: 18px;
      right: 18px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(47,155,214,0.22);
      padding: 8px;
      gap: 2px;
      z-index: 60;
    }
    .topbar.nav-open .navlinks > a {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 10px;
    }
    .topbar.nav-open .nav-active { box-shadow: none; }
  }
</style>
</head>
<body data-require-auth>
<div class="page">

  <div class="topbar">
    <div style="font-size: 20px; font-weight: 800; color: #2f9bd6;"><a href="admin-members.html" style="color:#2f9bd6;">[サイト名] 管理画面</a></div>
    <div class="nav-toggle-btn" onclick="toggleMobileNav()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f9bd6" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
    <div class="navlinks">
      <a href="admin-members.html" class="nav-inactive">会員一覧</a>
      <a href="admin-capacity.html" class="nav-inactive">制作枠</a>
      <a href="admin-requests.html" class="nav-inactive">申請管理</a>
      <a href="admin-inbox.html" class="nav-active">メッセージ</a>
      <a href="admin-payments.html" class="nav-inactive">決済状況</a>
      <a href="admin-announce.html" class="nav-inactive">お知らせ配信</a>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: #5c6b73;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #d6f0fb; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #1f7fb3;">運</div>
      <div>あなた（運営）</div>
    </div>
  </div>

  <div style="padding: 4px 36px 36px; display: flex; flex-direction: column; gap: 12px; flex-grow: 1;">

    <div>
      <div style="font-size: 20px; font-weight: 800;">メッセージ</div>
      <div style="font-size: 12px; color: #9db0b8; margin-top: 2px;">申請ごとのやり取りを一覧で確認できます。左から選ぶと、右側の表示がそのまま切り替わります。</div>
    </div>

    <div class="inbox-split">

      <div class="inbox-list">

        <div style="padding: 14px 16px 10px;">
          <input id="contact-search" type="text" placeholder="会員・内容で検索" style="width: 100%; border: 1px solid #dcedf5; border-radius: 999px; padding: 8px 14px; font-size: 12px; color: #3b454a; font-family: inherit; outline: none;">
        </div>

        <div id="contact-rows" style="display: flex; flex-direction: column; overflow-y: auto;">
          <div style="padding: 20px 16px; font-size: 12px; color: #9db0b8; text-align: center;">読み込み中…</div>
        </div>

      </div>

      <div class="inbox-thread">

        <div id="panel-empty" style="display: flex; align-items: center; justify-content: center; flex-grow: 1; font-size: 13px; color: #9db0b8;">左の一覧から会員を選んでください</div>

        <div id="panel-thread" style="display: none; flex-direction: column; flex-grow: 1;">

          <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; border-bottom: 1px solid #eef2f4; gap: 10px;">
            <div style="min-width: 0; display: flex; align-items: center; gap: 10px;">
              <div class="thread-back-link" onclick="backToList()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2f9bd6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
              </div>
              <div style="min-width: 0;">
                <div id="thread-member-name" style="font-size: 14px; font-weight: 800;">ー</div>
                <div id="thread-title" style="font-size: 11px; color: #9db0b8; margin-top: 2px;">ー</div>
              </div>
            </div>
            <div id="thread-status-pill" style="font-size: 11px; font-weight: 700; padding: 5px 14px; border-radius: 999px; background: #eef2f4; color: #8fa2ac; flex-shrink: 0;">ー</div>
          </div>

          <div id="thread-messages" style="display: flex; flex-direction: column; gap: 14px; padding: 20px 22px; flex-grow: 1; overflow-y: auto;"></div>

          <div id="thread-composers" style="display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #eef2f4; padding: 16px 22px;"></div>

          <div style="display: flex; align-items: flex-end; gap: 10px; padding: 14px 22px 0; border-top: 1px solid #eef2f4;">
            <textarea id="thread-send-input" rows="1" placeholder="メッセージを入力…" style="flex-grow: 1; border: 1px solid #dcedf5; border-radius: 18px; padding: 10px 18px; font-size: 13px; color: #3b454a; font-family: inherit; outline: none; resize: none; max-height: 160px; line-height: 1.5;"></textarea>
            <div id="thread-send-btn" style="background: #2f9bd6; color: #fff; font-weight: 700; font-size: 13px; padding: 10px 22px; border-radius: 999px; flex-shrink: 0; cursor: pointer;">送信</div>
          </div>

          <div id="thread-send-hint" style="font-size: 10.5px; color: #b3c2c9; text-align: right; padding: 4px 22px 0;"></div>

          <div style="font-size: 10.5px; color: #b3c2c9; text-align: center; padding: 6px 22px 14px;">お知らせメールが届かない場合は、迷惑メールフォルダに振り分けられていないかご確認ください。</div>

        </div>

      </div>

    </div>

  </div>
</div>
<script>
  function toggleMobileNav() {
    var topbar = document.querySelector('.topbar');
    if (topbar) topbar.classList.toggle('nav-open');
  }
  document.addEventListener('click', function (e) {
    var topbar = document.querySelector('.topbar');
    if (topbar && topbar.classList.contains('nav-open') && !topbar.contains(e.target)) {
      topbar.classList.remove('nav-open');
    }
  });
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="auth.js"></script>
<script>
  var STATUS_STYLE = {
    'ヒアリング中': { bg: '#f1eefb', color: '#6a4fc0' },
    '制作中': { bg: '#fff0da', color: '#b3791a' },
    '対応完了': { bg: '#e6f7ea', color: '#3f9457' },
    'キャンセル': { bg: '#eef2f4', color: '#8fa2ac' }
  };
  var PLAN_TAG = {
    point: { cls: 'point', label: 'ポイント' },
    monthly: { cls: 'monthly', label: '月1' }
  };

  var allThreads = [];
  var selectedId = null;
  var editingMessageId = null;
  var currentMessages = [];
  var currentApplication = null;

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formatDateTime(iso) {
    var d = new Date(iso);
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function renderContactRows() {
    var filter = (document.getElementById('contact-search').value || '').trim().toLowerCase();
    var container = document.getElementById('contact-rows');
    var filtered = allThreads.filter(function (t) {
      if (!filter) return true;
      return (t.member_display_name + ' ' + t.title).toLowerCase().indexOf(filter) !== -1;
    });

    if (!filtered.length) {
      container.innerHTML = '<div style="padding: 20px 16px; font-size: 12px; color: #9db0b8; text-align: center;">該当する申請はありません</div>';
      return;
    }

    container.innerHTML = filtered.map(function (t) {
      var initial = t.member_display_name ? t.member_display_name.charAt(0) : '?';
      var planTag = PLAN_TAG[t.member_plan] || PLAN_TAG.point;
      var unread = t.unread_count > 0;
      var snippet = t.last_message_body || t.title;
      var when = t.last_message_at ? formatDateTime(t.last_message_at) : formatDateTime(t.created_at);
      var rowCls = 'contact-row' + (unread ? ' unread' : '') + (String(t.id) === String(selectedId) ? ' active' : '');

      return (
        '<div class="' + rowCls + '" data-id="' + t.id + '" onclick="selectContact(' + t.id + ')">' +
          '<div style="width: 34px; height: 34px; border-radius: 50%; background: ' + (unread ? '#eef2f4' : '#d6f0fb') + '; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: ' + (unread ? '#9db0b8' : '#1f7fb3') + '; flex-shrink: 0;">' + escapeHtml(initial) + '</div>' +
          '<div style="flex-grow: 1; min-width: 0;">' +
            '<div style="display: flex; align-items: center; justify-content: space-between; gap: 6px;">' +
              '<div style="display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0;">' +
                '<div style="font-size: 12.5px; font-weight: 800; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + escapeHtml(t.member_display_name) + ' さん</div>' +
                '<span class="plan-tag ' + planTag.cls + '">' + planTag.label + '</span>' +
              '</div>' +
              '<div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">' +
                (unread ? '<span class="unread-badge">' + t.unread_count + '</span>' : '') +
                '<div style="font-size: 9.5px; color: #9db0b8;">' + when + '</div>' +
              '</div>' +
            '</div>' +
            '<div style="font-size: 11px; color: ' + (unread ? '#3b454a; font-weight: 700;' : '#5c6b73;') + ' margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">' + escapeHtml(snippet) + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  function loadInbox() {
    AuthHelpers.callFunction('admin-data', { method: 'GET', query: { inbox: 1 } }).then(function (data) {
      allThreads = data.threads || [];
      renderContactRows();
      if (selectedId) loadThread(selectedId);
    }).catch(function (err) {
      document.getElementById('contact-rows').innerHTML = '<div style="padding: 20px 16px; font-size: 12px; color: #c0524f; text-align: center;">読み込みに失敗しました：' + err.message + '</div>';
    });
  }

  function selectContact(id) {
    selectedId = id;
    history.replaceState(null, '', '#' + id);
    renderContactRows();
    document.getElementById('panel-empty').style.display = 'none';
    document.getElementById('panel-thread').style.display = 'flex';
    document.body.classList.add('mobile-thread-open');
    loadThread(id);
  }

  function backToList() {
    document.body.classList.remove('mobile-thread-open');
  }

  function renderComposers(application) {
    var container = document.getElementById('thread-composers');
    if (application.status === 'ヒアリング中') {
      container.innerHTML =
        '<div class="quote-btn" onclick="toggleComposer()">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6a4fc0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M2 12h20"/></svg>' +
          'ポイントを提示する' +
        '</div>' +
        '<div id="composer-box" class="composer">' +
          '<div style="font-size: 12px; font-weight: 800; color: #6a4fc0;">確定ポイント数</div>' +
          '<input id="quote-pt-input" class="pt-input" type="number" min="1" step="1" placeholder="例）5">' +
          '<div style="font-size: 12px; font-weight: 800; color: #6a4fc0; margin-top: 4px;">備考（会員に表示されます・任意）</div>' +
          '<textarea id="quote-note-input" style="width: 100%; min-height: 60px; border: 1px solid #e3dcf5; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; font-family: inherit; color: #3b454a; outline: none; resize: vertical; background: #ffffff;" placeholder="例）複数人・背景込みの一枚絵として5ptでご案内します。"></textarea>' +
          '<div class="send-quote-btn" onclick="sendQuote()">この内容で見積もりを送信</div>' +
        '</div>';
    } else if (application.status === '制作中') {
      container.innerHTML =
        '<div class="deliver-btn" onclick="toggleComposer()">' +
          '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3f9457" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V7a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 7v10a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 17v-1"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg>' +
          '納品する' +
        '</div>' +
        '<div id="composer-box" class="composer deliver-composer">' +
          '<div style="font-size: 12px; font-weight: 800; color: #3f9457;">会員へのメッセージ（任意）</div>' +
          '<textarea id="delivery-note-input" style="width: 100%; min-height: 60px; border: 1px solid #cfe8d6; border-radius: 10px; padding: 10px 14px; font-size: 12.5px; font-family: inherit; color: #3b454a; outline: none; resize: vertical; background: #ffffff;" placeholder="例）お待たせしました！ご依頼の一枚絵が完成しましたので、ご確認をお願いいたします。"></textarea>' +
          '<div class="send-deliver-btn" onclick="sendDelivery()">この内容で納品する</div>' +
        '</div>';
    } else {
      container.innerHTML = '';
    }
  }

  function toggleComposer() {
    var el = document.getElementById('composer-box');
    if (!el) return;
    el.style.display = (el.style.display === 'flex') ? 'none' : 'flex';
  }

  function renderThreadMessages(messages, application) {
    var container = document.getElementById('thread-messages');
    if (!messages.length) {
      container.innerHTML = '<div style="padding: 20px 0; font-size: 12px; color: #9db0b8; text-align: center;">まだメッセージはありません</div>';
      return;
    }
    container.innerHTML = messages.map(function (m) {
      var when = formatDateTime(m.created_at);

      if (m.kind === 'system') {
        return (
          '<div style="display:flex; justify-content:center;">' +
            '<div style="background:#f2f6f7; color:#8fa2ac; font-size:11.5px; padding:10px 18px; border-radius:999px; text-align:center; max-width:480px; line-height:1.6;">' + escapeHtml(m.body) + '</div>' +
          '</div>'
        );
      }

      if (m.kind === 'quote') {
        var priceYen = (m.point_cost * 10000).toLocaleString();
        var statusNote = '';
        if (m.quote_status === 'pending') statusNote = '<div style="font-size:10.5px; font-weight:700; color:#b3791a; background:#fff0da; padding:4px 10px; border-radius:999px; align-self:flex-start;">会員の確認待ち</div>';
        else if (m.quote_status === 'accepted') statusNote = '<div style="font-size:10.5px; font-weight:700; color:#3f9457; background:#e6f7ea; padding:4px 10px; border-radius:999px; align-self:flex-start;">正式受付済み</div>';
        else if (m.quote_status === 'superseded') statusNote = '<div style="font-size:10.5px; color:#b3c2c9;">新しい内容に更新済み</div>';
        return (
          '<div class="msg-row" style="align-items:flex-end;">' +
            '<div class="quote-card" style="align-self:flex-end;">' +
              '<div style="display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800; color:#6a4fc0;">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#6a4fc0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>' +
                'ポイントのご提示' +
              '</div>' +
              '<div style="font-size:20px; font-weight:800; color:#3b454a;">' + m.point_cost + 'pt<span style="font-size:12px; font-weight:700; color:#9db0b8; margin-left:6px;">（¥' + priceYen + '＋消費税10%）</span></div>' +
              (m.body ? '<div style="font-size:12px; color:#4b5a61; line-height:1.6;">' + escapeHtml(m.body) + '</div>' : '') +
              statusNote +
            '</div>' +
            '<div class="meta">あなた（運営）　' + when + '</div>' +
          '</div>'
        );
      }

      if (m.kind === 'delivery') {
        return (
          '<div class="msg-row" style="align-items:flex-end;">' +
            '<div class="deliver-card" style="align-self:flex-end;">' +
              '<div style="display:flex; align-items:center; gap:6px; font-size:11px; font-weight:800; color:#3f9457;">' +
                '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#3f9457" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8V7a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 7v10a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 17v-1"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/></svg>' +
                '納品しました' +
              '</div>' +
              '<div style="font-size:12px; color:#4b5a61; line-height:1.6;">' + escapeHtml(m.body) + '</div>' +
            '</div>' +
            '<div class="meta">あなた（運営）　' + when + '</div>' +
          '</div>'
        );
      }

      var mine = (m.sender === 'admin');

      if (mine && editingMessageId === m.id) {
        return (
          '<div class="msg-row" style="align-items:flex-end;">' +
            '<div style="max-width:420px; width:100%; align-self:flex-end; display:flex; flex-direction:column; gap:6px;">' +
              '<textarea id="edit-input-' + m.id + '" style="width:100%; min-height:60px; border:1px solid #dcedf5; border-radius:12px; padding:10px 14px; font-size:13px; font-family:inherit; color:#3b454a; outline:none; resize:vertical;">' + escapeHtml(m.body) + '</textarea>' +
              '<div style="display:flex; gap:8px; align-self:flex-end;">' +
                '<div style="font-size:11px; font-weight:700; color:#9db0b8; padding:7px 14px; border-radius:999px; cursor:pointer; background:#f2f6f7;" onclick="cancelEditMessage()">キャンセル</div>' +
                '<div style="font-size:11px; font-weight:700; color:#fff; padding:7px 16px; border-radius:999px; cursor:pointer; background:#2f9bd6;" onclick="saveEditMessage(' + m.id + ')">保存</div>' +
              '</div>' +
            '</div>' +
          '</div>'
        );
      }

      return (
        '<div class="msg-row" style="align-items:' + (mine ? 'flex-end' : 'flex-start') + ';">' +
          '<div class="bubble ' + (mine ? 'mine' : 'theirs') + '">' + escapeHtml(m.body) + '</div>' +
          '<div class="meta">' + (mine ? 'あなた（運営）' : escapeHtml(application.member_display_name) + ' さん') + '　' + when +
            (m.edited_at ? '　（編集済み）' : '') +
            (mine ? '　<span class="edit-link" onclick="startEditMessage(' + m.id + ')">編集</span>' : '') +
          '</div>' +
        '</div>'
      );
    }).join('');

    container.scrollTop = container.scrollHeight;
  }

  function loadThread(id) {
    AuthHelpers.callFunction('admin-data', { method: 'GET', query: { thread: id } }).then(function (data) {
      document.getElementById('thread-member-name').textContent = data.application.member_display_name + ' さん';
      document.getElementById('thread-title').textContent = data.application.title + (data.application.point_cost != null ? '（' + data.application.point_cost + 'pt）' : '');
      var style = STATUS_STYLE[data.application.status] || { bg: '#eef2f4', color: '#8fa2ac' };
      var pill = document.getElementById('thread-status-pill');
      pill.textContent = data.application.status;
      pill.style.background = style.bg;
      pill.style.color = style.color;

      currentMessages = data.messages;
      currentApplication = data.application;
      editingMessageId = null;

      renderComposers(data.application);
      renderThreadMessages(data.messages, data.application);

      // 未読が既読になったので、一覧側の未読バッジも更新する
      loadInboxQuiet();
    }).catch(function (err) {
      document.getElementById('thread-messages').innerHTML = '<div style="padding: 20px 0; font-size: 12px; color: #c0524f; text-align: center;">読み込みに失敗しました：' + err.message + '</div>';
    });
  }

  function loadInboxQuiet() {
    AuthHelpers.callFunction('admin-data', { method: 'GET', query: { inbox: 1 } }).then(function (data) {
      allThreads = data.threads || [];
      renderContactRows();
    }).catch(function () {});
  }

  function sendThreadMessage() {
    var input = document.getElementById('thread-send-input');
    var text = input.value.trim();
    if (!text || !selectedId) return;
    AuthHelpers.callFunction('admin-data', { method: 'POST', body: { action: 'send-message', application_id: selectedId, body: text } })
      .then(function () {
        input.value = '';
        autoResizeThreadInput();
        loadThread(selectedId);
      })
      .catch(function (err) { alert('送信に失敗しました：' + err.message); });
  }

  function autoResizeThreadInput() {
    var input = document.getElementById('thread-send-input');
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }

  function renderThreadSendHint() {
    var isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent || '');
    var ctrlLabel = isMac ? '⌘' : 'Ctrl';
    document.getElementById('thread-send-hint').innerHTML =
      '<span class="kbd">Enter</span> で改行　<span class="kbd">' + ctrlLabel + '</span>+<span class="kbd">↵</span> で送信';
  }

  function startEditMessage(id) {
    editingMessageId = id;
    renderThreadMessages(currentMessages, currentApplication);
  }

  function cancelEditMessage() {
    editingMessageId = null;
    renderThreadMessages(currentMessages, currentApplication);
  }

  function saveEditMessage(id) {
    var ta = document.getElementById('edit-input-' + id);
    var text = ta.value.trim();
    if (!text) { alert('メッセージを入力してください。'); return; }
    AuthHelpers.callFunction('admin-data', { method: 'POST', body: { action: 'edit-message', application_id: selectedId, message_id: id, body: text } })
      .then(function () {
        editingMessageId = null;
        loadThread(selectedId);
      })
      .catch(function (err) { alert('編集に失敗しました：' + err.message); });
  }

  function sendQuote() {
    var pt = Number(document.getElementById('quote-pt-input').value);
    var note = document.getElementById('quote-note-input').value.trim();
    if (!pt || pt < 1) { alert('提示ポイント数を入力してください。'); return; }
    AuthHelpers.callFunction('admin-data', { method: 'POST', body: { action: 'send-quote', application_id: selectedId, point_cost: pt, note: note } })
      .then(function () { loadThread(selectedId); })
      .catch(function (err) { alert('送信に失敗しました：' + err.message); });
  }

  function sendDelivery() {
    var note = document.getElementById('delivery-note-input').value.trim();
    AuthHelpers.callFunction('admin-data', { method: 'POST', body: { action: 'send-delivery', application_id: selectedId, note: note } })
      .then(function () { loadThread(selectedId); })
      .catch(function (err) { alert('納品に失敗しました：' + err.message); });
  }

  document.getElementById('thread-send-btn').addEventListener('click', sendThreadMessage);
  document.getElementById('thread-send-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      sendThreadMessage();
    }
  });
  document.getElementById('thread-send-input').addEventListener('input', autoResizeThreadInput);
  renderThreadSendHint();
  document.getElementById('contact-search').addEventListener('input', renderContactRows);

  function applyHash() {
    var hash = location.hash.replace('#', '');
    if (hash) selectContact(Number(hash));
  }

  if (window.netlifyIdentity) {
    netlifyIdentity.on('init', function (user) {
      if (!user || !window.AuthHelpers) return;
      loadInbox();
      applyHash();
    });
  }
</script>
