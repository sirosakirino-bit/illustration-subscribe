<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お支払い手続き｜Xovy Studio</title>
<link rel="preload" as="font" type="font/ttf" href="fonts/GenEiKiwamiGo.ttf" crossorigin>
<link rel="preload" as="font" type="font/woff" href="fonts/KosugiMaru-Regular.woff" crossorigin>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="favicon-180.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<style>
  /* サイト全体で表示されるスクロールバーの配色を統一（水色） */
  *::-webkit-scrollbar { width: 9px; height: 9px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: #cfe6f1; border-radius: 999px; }
  *::-webkit-scrollbar-thumb:hover { background: #9ed2ea; }
  html { scrollbar-width: thin; scrollbar-color: #cfe6f1 transparent; }

  @font-face { font-family: 'GenEi Kiwami Gothic'; src: url('fonts/GenEiKiwamiGo.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: optional; }
  @font-face { font-family: 'Kosugi Maru'; src: url('fonts/KosugiMaru-Regular.woff') format('woff'), url('fonts/KosugiMaru-Regular.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: optional; }
  @font-face { font-family: 'Dela Gothic One'; src: url('fonts/DelaGothicOne-Regular.woff') format('woff'), url('fonts/DelaGothicOne-Regular.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: optional; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(circle, #c9e2ef 1px, transparent 1px) 0 0/26px 26px, linear-gradient(180deg, #eef8fd 0%, #f7fbff 100%); font-family: 'Kosugi Maru', system-ui, sans-serif; color: #3b454a; line-height: 1.85; letter-spacing: 0.2px; text-rendering: optimizeLegibility; min-height: 100vh; }
  a { color: #2f9bd6; text-decoration: none; }

  .page { width: 100%; max-width: 900px; display: flex; flex-direction: column; align-items: center; margin: 0 auto; }
  .logo-bar { width: 100%; padding: 26px 36px; font-size: 20px; font-weight: 800; color: #2f9bd6; font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-weight: 400; }
  .steps-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; row-gap: 6px; margin-top: 10px; font-size: 12px; font-weight: 700; padding: 0 18px; }
  .step-num { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .step-line { width: 28px; height: 1px; background: #cbe0e9; flex-shrink: 0; }
  .payment-card { width: 100%; max-width: 480px; background: #ffffff; border-radius: 20px; padding: 40px 36px; margin-top: 22px; margin-bottom: 40px; box-shadow: 0 4px 14px rgba(47,155,214,0.10); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 18px; }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #dcedf5; border-top-color: #2f9bd6; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 820px) {
    .logo-bar { padding: 18px 20px; }
    .steps-row { font-size: 10.5px; gap: 5px; }
    .step-num { width: 18px; height: 18px; }
    .step-line { width: 16px; }
    .payment-card { padding: 30px 22px; margin-top: 16px; }
  }
</style>
</head>
<body data-require-auth>
<div class="page">

  <div class="logo-bar"><a href="index.html" style="display:flex;align-items:center;gap:6px;color:#2f9bd6;"><img src="logo-icon.png" alt="" style="height:36px;width:auto;display:block;">Xovy Studio ✧</a></div>

  <div class="steps-row">
    <div class="step-num" style="background: #ffffff; border: 1px solid #cbe0e9; color: #5c6b73;">✓</div>
    <div style="color: #5c6b73;">プラン選択</div>
    <div class="step-line"></div>
    <div class="step-num" style="background: #ffffff; border: 1px solid #cbe0e9; color: #5c6b73;">✓</div>
    <div style="color: #5c6b73;">規約確認</div>
    <div class="step-line"></div>
    <div class="step-num" style="background: #ffffff; border: 1px solid #cbe0e9; color: #5c6b73;">✓</div>
    <div style="color: #5c6b73;">アカウント作成</div>
    <div class="step-line"></div>
    <div class="step-num" style="background: #2f9bd6; color: #fff;">4</div>
    <div style="color: #2f9bd6;">お支払い</div>
  </div>

  <div class="payment-card">

    <div id="state-loading" style="display: flex; flex-direction: column; align-items: center; gap: 18px;">
      <div class="spinner"></div>
      <div>
        <div style="font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-size: 16px; font-weight: 800; font-weight: 400;">お支払い手続きへ移動しています…</div>
        <div style="font-size: 11.5px; color: #5c6b73; margin-top: 8px;">まもなく決済（Stripe）の安全な入力画面に移動します。しばらくお待ちください。</div>
      </div>
    </div>

    <div id="state-error" style="display: none; flex-direction: column; align-items: center; gap: 16px;">
      <div style="width: 48px; height: 48px; border-radius: 50%; background: #fbecec; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c0524f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
      <div>
        <div style="font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-size: 15px; font-weight: 800; font-weight: 400;">お支払い手続きへ移動できませんでした</div>
        <div id="error-message" style="font-size: 12px; color: #c0524f; margin-top: 10px;"></div>
      </div>
      <div id="retry-btn" style="background: #2f9bd6; color: #fff; font-weight: 700; font-size: 13px; padding: 12px 28px; border-radius: 999px; cursor: pointer; box-shadow: 0 4px 12px rgba(47,155,214,0.3);">もう一度試す</div>
      <div style="font-size: 10.5px; color: #5c6b73;">解決しない場合は、お手数ですが運営までお問い合わせください。</div>
    </div>

  </div>

</div>

<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="auth.js"></script>
<script>
  function showError(msg) {
    document.getElementById('state-loading').style.display = 'none';
    var errBox = document.getElementById('state-error');
    errBox.style.display = 'flex';
    document.getElementById('error-message').textContent = msg;
  }

  function showLoading() {
    document.getElementById('state-error').style.display = 'none';
    document.getElementById('state-loading').style.display = 'flex';
  }

  function startCheckout() {
    showLoading();
    // member-data(GET)を先に呼び、会員レコードがまだ無ければここで作成してから決済セッションを作る
    AuthHelpers.callFunction('member-data', { method: 'GET' })
      .then(function () {
        return AuthHelpers.callFunction('stripe-checkout', { method: 'POST' });
      })
      .then(function (data) {
        if (!data || !data.url) throw new Error('決済セッションの作成に失敗しました');
        location.href = data.url;
      })
      .catch(function (err) {
        // すでに決済手続きが完了している会員が、誤ってこのページに来た場合はマイページへ案内する
        if (err && err.statusCode === 400 && /完了/.test(err.message || '')) {
          location.href = 'mypage.html';
          return;
        }
        showError(err.message || 'お支払い手続きの開始に失敗しました。通信環境をご確認のうえ、もう一度お試しください。');
      });
  }

  document.getElementById('retry-btn').addEventListener('click', startCheckout);

  if (window.netlifyIdentity) {
    netlifyIdentity.on('init', function (user) {
      if (!user) return; // data-require-authによりlogin.htmlへ遷移する
      startCheckout();
    });
  }
</script>
<div style="text-align: center; padding: 18px 36px 14px; font-size: 10.5px; color: #b3c2c9;">
  &copy; 2026 Xovy Studio&#12288;<a href="legal.html" style="color: #5c6b73; text-decoration: underline;">利用規約・プライバシーポリシー・特定商取引法に基づく表記</a>
</div>
</body>
</html>
