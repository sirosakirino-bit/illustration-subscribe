<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイページ｜Xovy Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&family=Dela+Gothic+One&display=swap">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="favicon-180.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<style>
  /* サイト全体で表示されるスクロールバーの配色を統一（水色） */
  *::-webkit-scrollbar { width: 9px; height: 9px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: #cfe6f1; border-radius: 999px; }
  *::-webkit-scrollbar-thumb:hover { background: #9ed2ea; }
  html { scrollbar-width: thin; scrollbar-color: #cfe6f1 transparent; }

  @font-face { font-family: 'GenEi Kiwami Gothic'; src: url('fonts/GenEiKiwamiGo.ttf') format('truetype'); font-weight: normal; font-style: normal; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: radial-gradient(circle, #c9e2ef 1px, transparent 1px) 0 0/26px 26px, linear-gradient(180deg, #eef8fd 0%, #f7fbff 100%); font-family: 'Kosugi Maru', system-ui, sans-serif; color: #3b454a; line-height: 1.85; letter-spacing: 0.2px; text-rendering: optimizeLegibility; min-height: 100vh; }
  a { color: #2f9bd6; text-decoration: none; }
  a:hover { color: #1f7fb3; }

  .page { width: 100%; max-width: 1100px; min-height: 100vh; display: flex; flex-direction: column; margin: 0 auto; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 22px 36px; flex-wrap: nowrap; gap: 10px; }
  .logo { display:flex; align-items:center; gap:6px; font-size: 20px; font-weight: 800; color: #2f9bd6;  font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-weight: 400; flex-shrink: 0; white-space: nowrap;}
  .navlinks { display: flex; gap: 10px; font-size: 13px; font-weight: 700; flex-wrap: wrap; flex: 0 1 auto; min-width: 0; }
  .navlinks > a { padding: 8px 16px; }
  .nav-toggle-btn { display: none; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: #eaf6fb; cursor: pointer; flex-shrink: 0; }
  .nav-active { background: #ffffff; color: #2f9bd6; border-radius: 999px; box-shadow: 0 2px 6px rgba(47,155,214,0.15); }
  .nav-inactive { color: #5c6b73; }
  .navlinks > a[data-action="logout"] { display: none; }
  .user { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: #5c6b73; flex-shrink: 0; white-space: nowrap; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #d6f0fb; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #1f7fb3; flex-shrink: 0; }

  .body-pad { padding: 12px 36px 36px; display: flex; flex-direction: column; gap: 26px; flex-grow: 1; }

  .welcome-card { background: #ffffff; border-radius: 20px; padding: 22px 28px; box-shadow: 0 4px 14px rgba(47,155,214,0.10); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .welcome-title { font-size: 22px; font-weight: 800; color: #3b454a;  font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-weight: 400;}
  .welcome-sub { font-size: 12px; color: #5c6b73; margin-top: 4px; }
  .welcome-icon { width: 56px; height: 56px; border-radius: 50%; background: #eef8fd; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

  .stats-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
  .stat-card { background: #ffffff; border-radius: 18px; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 3px 10px rgba(47,155,214,0.08); }
  .stat-label { font-size: 11px; color: #5c6b73; font-weight: 700; }
  .stat-value { font-size: 20px; font-weight: 800; color: #2f9bd6;  font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-weight: 400;}
  .stat-badge { display: inline-flex; align-self: flex-start; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 999px; background: #e6f7ea; color: #3f9457; }
  .stat-note { font-size: 11px; color: #5c6b73; }

  .cta-row { display: flex; justify-content: flex-start; }
  .cta-btn { background: #2f9bd6; color: #fff; font-weight: 700; font-size: 13px; padding: 13px 26px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(47,155,214,0.3); }

  .history-card { background: #ffffff; border-radius: 18px; padding: 22px 26px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 3px 10px rgba(47,155,214,0.08); }
  .history-title { font-size: 13px; font-weight: 800; color: #3b454a; margin-bottom: 10px; }
  .history-row { display: flex; align-items: center; padding: 10px 0; font-size: 13px; color: #4b5a61; }
  .history-row.divider { border-bottom: 1px dashed #dcedf5; }
  .history-row.linked { cursor: pointer; }
  .history-row.linked:hover .history-name { color: #2f9bd6; }
  .history-date { width: 90px; color: #5c6b73; flex-shrink: 0; }
  .history-name { flex-grow: 1; display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #c0524f; flex-shrink: 0; }
  .status-pill { font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 999px; flex-shrink: 0; }
  .status-progress { background: #fff0da; color: #b3791a; }
  .status-done { background: #e6f7ea; color: #3f9457; }

  @media (max-width: 1000px) {
    .topbar { padding: 16px 18px; }
    .logo { order: 1;  font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-weight: 400;}
    .user { order: 2; }
    .navlinks { order: 3; flex-basis: 100%; font-size: 11.5px; gap: 4px; }
    .navlinks > a { padding: 7px 10px; }
    .user > div:last-child { display: none; }
    .body-pad { padding: 8px 18px 24px; gap: 18px; }
    .welcome-card { padding: 18px 20px; }
    .welcome-title { font-size: 17px;  font-family: 'GenEi Kiwami Gothic', 'Dela Gothic One', system-ui, sans-serif; font-weight: 400;}
    .welcome-icon { width: 44px; height: 44px; }
    .stats-grid { grid-template-columns: 1fr; gap: 12px; }
    .stat-card { padding: 16px 18px; }
    .history-card { padding: 18px 18px; }
    .history-date { width: 56px; font-size: 12px; }
    .history-name { font-size: 12.5px; }
  }

  @media (max-width: 1000px) {
    .topbar { padding: 16px 18px; position: relative; justify-content: flex-start; }
    .topbar > div:first-child { order: 1; }
    .topbar > div:last-child { order: 2; }
    .topbar > div:last-child { display: flex; flex-shrink: 0; gap: 6px; order: 2; margin-left: auto; }
    .avatar { flex-shrink: 0; }
    .user-name-row { display: none; }
    .user > a[data-action="logout"] { display: none; }
    .nav-toggle-btn { display: flex; order: 3; }
    .navlinks { display: none; }
    .topbar.nav-open .navlinks {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: calc(100% + 6px);
      left: 18px;
      right: 18px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(47,155,214,0.22);
      padding: 8px;
      gap: 2px;
      z-index: 60;
    }
    .topbar.nav-open .navlinks > a {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border-radius: 10px;
    }
    .topbar.nav-open .navlinks > a[data-action="logout"] { display: block; border-top: 1px solid #eef2f4; margin-top: 4px; padding-top: 14px; }
    .topbar.nav-open .nav-active { box-shadow: none; }
  }
</style>
</head>
<body data-require-auth>
<div class="page">

  <div class="topbar">
    <div class="logo"><a href="mypage.html" style="display:flex;align-items:center;gap:6px;color:#2f9bd6;"><img src="logo-icon.png" alt="" style="height:36px;width:auto;display:block;">Xovy Studio ✧</a></div>
    <div class="nav-toggle-btn" onclick="toggleMobileNav()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2f9bd6" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></div>
    <div class="navlinks">
      <a href="mypage.html" class="nav-active">マイページ</a>
      <a href="apply.html" id="nav-apply-link" class="nav-inactive">ポイントを使う</a>
      <a href="history.html" class="nav-inactive" style="display: flex; align-items: center; gap: 6px;">申請履歴<span id="history-nav-badge" style="display: none; align-items: center; justify-content: center; min-width: 15px; height: 15px; padding: 0 4px; background: #c0524f; color: #fff; font-size: 9px; font-weight: 800; border-radius: 999px;">0</span></a>

      <div class="user-name-row"><span data-user-name>[会員名]</span> さん</div>

    </div>
  </div>

  <div class="body-pad">

    <div class="welcome-card">

        <div class="welcome-title">おかえり、<span data-user-name>[会員名]</span> さん！</div>
        <div class="welcome-sub" data-user-email>メールアドレス取得中…</div>
      </div>
      <div class="welcome-icon">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2f9bd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>

    <div class="stats-grid">

      <div class="stat-card">
        <div class="stat-label">現在のプラン</div>
        <div class="stat-value" id="stat-plan">読み込み中…</div>
        <div class="stat-badge">利用中</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">ポイント残高</div>
        <div class="stat-value" id="stat-balance">ー</div>
        <div class="stat-note" id="stat-balance-note">読み込み中…</div>

      <div class="stat-card">

        <div class="stat-value" id="stat-billing-value" style="color: #5c6b73; font-size: 15px;">ー</div>

    <div class="cta-row">
      <a href="apply.html" id="cta-apply-link" class="cta-btn">

        <span>＞</span>

  </div>

<script>
  function toggleMobileNav() {
    var topbar = document.querySelector('.topbar');
    if (topbar) topbar.classList.toggle('nav-open');
  }
  document.addEventListener('click', function (e) {
    var topbar = document.querySelector('.topbar');
    if (topbar && topbar.classList.contains('nav-open') && !topbar.contains(e.target)) {
      topbar.classList.remove('nav-open');
    }
  });
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script src="auth.js"></script>
<script>
  var PLAN_LABELS = { point: 'ポイントプラン', monthly: '月1プラン' };
  var STATUS_STYLE = {
    'ヒアリング中': { bg: '#f1eefb', color: '#6a4fc0' },
    '制作中': { bg: '#fff0da', color: '#b3791a' },
    '対応完了': { bg: '#e6f7ea', color: '#3f9457' },
    'キャンセル': { bg: '#eef2f4', color: '#8fa2ac' }
  };

  function formatDate(iso) {
    var d = new Date(iso);
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  function renderMypageHistory(applications) {
    var container = document.getElementById('mypage-history-rows');
    var recent = applications.slice(0, 2);
    if (!recent.length) {
      container.innerHTML = '<div style="padding: 14px 0; font-size: 12px; color: #5c6b73;">まだ申請はありません</div>';
      return;
    }
    container.innerHTML = recent.map(function (app, i) {
      var style = STATUS_STYLE[app.status] || { bg: '#eef2f4', color: '#8fa2ac' };
      var cls = 'history-row linked' + (i < recent.length - 1 ? ' divider' : '');
      var ptText = app.point_cost != null ? ('（' + app.point_cost + 'pt）') : '';
      var unread = app.unread_count > 0;
      return (
        '<a class="' + cls + '" href="message.html?id=' + app.id + '" style="text-decoration:none; color:inherit;">' +
          '<div class="history-date">' + formatDate(app.created_at) + '</div>' +
          '<div class="history-name">' + (unread ? '<span class="dot"></span>' : '') + app.title + ptText + '</div>' +
          '<div class="status-pill" style="background:' + style.bg + ';color:' + style.color + ';">' + app.status + '</div>' +
        '</a>'
      );
    }).join('');
  }

  function updateNavBadge(applications) {
    var total = (applications || []).reduce(function (sum, a) { return sum + (a.unread_count || 0); }, 0);
    var badges = document.querySelectorAll('#history-nav-badge');
    badges.forEach(function (badge) {
      if (total > 0) {
        badge.textContent = total;
        badge.style.display = 'inline-flex';
      } else {
        badge.style.display = 'none';
      }
    });
  }

  var PAYMENT_BANNERS = {
    pending: {
      bg: '#fdf9f2', border: '#f2e0c4', color: '#8a6524',
      text: 'まだお支払い手続きが完了していません。ご利用を開始するには決済手続きを完了してください。',
      linkHref: 'signup-payment.html', linkText: 'お支払い手続きに進む'
    },
    past_due: {
      bg: '#fbecec', border: '#f3d3d3', color: '#c0524f',
      text: 'お支払い処理に失敗しています。カード情報をご確認のうえ、お支払い方法の更新をお願いいたします。解消されない場合、一定期間後に自動的に退会扱いとなります。',
      linkHref: 'settings.html', linkText: 'お支払い方法を確認する'
    },
    paused: {
      bg: '#fff0da', border: '#f2d9ad', color: '#b3791a',
      text: '現在、サブスクリプションは休止中です。運営からのご案内をお待ちください。',
      linkHref: null, linkText: null
    },
    canceled: {
      bg: '#eef2f4', border: '#dde4e7', color: '#5c6b73',
      text: 'ご利用は終了しています。再度ご利用になる場合は、お手数ですが新規にお申し込みください。',
      linkHref: null, linkText: null
    }
  };

  function renderPaymentBanner(member) {
    var area = document.getElementById('payment-banner-area');
    var checkoutParam = new URLSearchParams(location.search).get('checkout');

    // Stripe Checkout完了直後はWebhookの反映に数秒かかることがあるため、
    // pending のままでも「手続き完了直後」の案内を優先して表示する
    if (checkoutParam === 'success' && member.payment_status === 'pending') {
      area.innerHTML =
        '<div style="background: #eaf6fb; border: 1px solid #cbe9f7; border-radius: 14px; padding: 12px 18px; font-size: 12px; color: #1f7fb3;">' +
          'お支払い手続きが完了しました。反映まで数秒〜数分かかる場合があります。反映されない場合はページを再読み込みしてください。' +
        '</div>';
      return;
    }

    var info = PAYMENT_BANNERS[member.payment_status];
    if (!info) { area.innerHTML = ''; return; }
    var linkHtml = info.linkHref
      ? '<a href="' + info.linkHref + '" style="font-weight: 700; text-decoration: underline; color:' + info.color + '; white-space: nowrap;">' + info.linkText + '</a>'
      : '';
    area.innerHTML =
      '<div style="background: ' + info.bg + '; border: 1px solid ' + info.border + '; border-radius: 14px; padding: 12px 18px; font-size: 12px; color: ' + info.color + '; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;">' +
        '<div>' + info.text + '</div>' + linkHtml +
      '</div>';
  }

  function formatDateSlash(iso) {
    var d = new Date(iso);
    return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
  }

  function renderBillingStat(member) {
    var valueEl = document.getElementById('stat-billing-value');
    var noteEl = document.getElementById('stat-billing-note');
    var balanceNoteEl = document.getElementById('stat-balance-note');
    var amount = member.plan === 'monthly' ? '27,500円' : '11,000円';

    if (member.payment_status === 'active') {
      document.getElementById('stat-billing-label').textContent = member.leave_requested_at ? '退会予定日' : '次回請求';
      valueEl.textContent = member.current_period_end ? formatDateSlash(member.current_period_end) : '次回更新日を確認中';
      valueEl.style.color = '#2f9bd6';
      valueEl.style.fontSize = '';
      noteEl.textContent = member.leave_requested_at ? 'この日付をもって退会予定です（請求は発生しません）' : (amount + '（税込）が請求されます');
      balanceNoteEl.textContent = member.plan === 'point' ? '毎月のご請求ごとに1ptずつ付与されます' : '月1プランはポイントを使用しません';
    } else if (member.payment_status === 'pending') {
      valueEl.textContent = '決済手続き待ち';
      valueEl.style.color = '#5c6b73'; valueEl.style.fontSize = '15px';
      noteEl.textContent = 'お支払い手続きが完了すると、ご請求が開始されます';
      balanceNoteEl.textContent = 'お支払い手続きの完了後にポイントが付与されます';
    } else if (member.payment_status === 'past_due') {
      valueEl.textContent = '支払い失敗中';
      valueEl.style.color = '#c0524f'; valueEl.style.fontSize = '15px';
      noteEl.textContent = '自動的に再試行されます。カード情報のご確認をお願いいたします';
      balanceNoteEl.textContent = 'お支払いが確認でき次第、付与を再開します';
    } else if (member.payment_status === 'paused') {
      valueEl.textContent = '休止中';
      valueEl.style.color = '#b3791a'; valueEl.style.fontSize = '15px';
      noteEl.textContent = 'ご請求は発生しません';
      balanceNoteEl.textContent = '休止中はポイントは付与されません';
    } else {
      valueEl.textContent = 'ー';
      valueEl.style.color = '#5c6b73'; valueEl.style.fontSize = '15px';
      noteEl.textContent = 'ご利用は終了しています';
      balanceNoteEl.textContent = '';
    }
  }

  function renderAnnouncements(list) {
    var area = document.getElementById('announcement-banner-area');
    if (!area) return;
    if (!list || list.length === 0) { area.innerHTML = ''; return; }
    area.innerHTML = list.map(function (a) {
      var d = new Date(a.created_at);
      var dateStr = d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate();
      return '<div style="background: #f7f5fc; border: 1px solid #e3dcf5; border-radius: 14px; padding: 12px 18px; font-size: 12px; color: #6a4fc0; display: flex; align-items: center; gap: 8px;">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6a4fc0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>' +
        dateStr + '　会員全体へお知らせメールを配信しました。メールをご確認ください。' +
      '</div>';
    }).join('');
  }

  if (window.netlifyIdentity) {
    netlifyIdentity.on('init', function (user) {
      if (!user || !window.AuthHelpers) return;
      AuthHelpers.callFunction('member-data', { method: 'GET' }).then(function (data) {
        document.getElementById('stat-plan').textContent = PLAN_LABELS[data.member.plan] || data.member.plan;
        document.getElementById('stat-balance').textContent = data.member.point_balance + ' pt';
        renderPaymentBanner(data.member);
        renderBillingStat(data.member);
        renderMypageHistory(data.applications);
        updateNavBadge(data.applications);
        renderAnnouncements(data.recentAnnouncements);

        if (data.member.plan === 'monthly') {
          document.getElementById('nav-apply-link').setAttribute('href', 'apply-monthly.html');
          document.getElementById('cta-apply-link').setAttribute('href', 'apply-monthly.html');
          document.getElementById('cta-apply-label').textContent = '今月のご依頼をする';
        }
      }).catch(function (err) {
        document.getElementById('stat-plan').textContent = '取得失敗';
        document.getElementById('stat-balance').textContent = '取得失敗';
        console.error(err);
      });
    });
  }
